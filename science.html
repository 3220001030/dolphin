<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>白海豚保护政策文本数据库</title>
<style>
:root{
  --bg:#f4fbff; --card:#ffffff; --line:#d7e5ef; --muted:#5b7285; --text:#10212f;
  --blue:#0ea5e9; --chip:#eef8ff;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--text);
  font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(14,165,233,.18), transparent 55%),
    radial-gradient(1000px 600px at 100% 0%, rgba(2,132,199,.10), transparent 50%),
    var(--bg);
  overflow-x:hidden;
  overflow-y:auto;
}
.wrap{max-width:1450px; margin:0 auto; padding:20px 16px 28px; min-height:100vh;}
.head,.sidebar,.main,.pageFooter{
  background:rgba(255,255,255,.88); border:1px solid var(--line); border-radius:18px;
  backdrop-filter: blur(8px); box-shadow:0 10px 28px rgba(15,23,42,.05);
}
.head{padding:18px 18px 14px; margin-bottom:14px;}
.headTop{display:flex; justify-content:space-between; gap:12px; align-items:flex-start;}
.titleRow{display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
h1{margin:0; font-size:28px}
.titleBadge{
  display:inline-flex; align-items:center; justify-content:center;
  padding:4px 10px; border-radius:10px;
  background:linear-gradient(135deg, #0f3b82, #1f5fbf);
  color:#fff; font-size:12px; font-weight:800; line-height:1;
  box-shadow:0 6px 16px rgba(15,59,130,.18);
  white-space:nowrap; transform:translateY(-1px);
  text-decoration:none;
}
.titleBadge:hover{text-decoration:none; filter:brightness(.98);}
.sourceBadge{
  display:inline-flex; align-items:center; justify-content:center;
  padding:4px 10px; border-radius:10px;
  background:linear-gradient(135deg, #8fd3ff, #49b8ff);
  color:#fff; font-size:12px; font-weight:800; line-height:1;
  box-shadow:0 6px 16px rgba(73,184,255,.18);
  white-space:nowrap; transform:translateY(-1px);
  text-decoration:none;
}
.sourceBadge:hover{text-decoration:none; filter:brightness(.98);}
.sub{margin:0; color:var(--muted)}
.note{margin:8px 0 0; color:var(--muted); font-size:12px}
.layout{display:grid; grid-template-columns:320px 1fr; gap:14px; align-items:start; min-height:calc(100vh - 160px);}
@media (max-width: 960px){ .layout{grid-template-columns:1fr; min-height:auto;} .headTop{flex-direction:column;} .titleRow{align-items:flex-start;} body{overflow:auto;} .sidebar,.main{max-height:none; overflow:visible;} .pageFooter{margin-top:14px;}}

.sidebar,.main{min-height:0;}

.pageFooter{
  padding:12px 14px; margin-top:14px; color:var(--muted); font-size:12px;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
}
.sidebar{padding:14px; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; overscroll-behavior:contain; scrollbar-gutter:stable;}
.main{padding:14px; max-height:calc(100vh - 24px); overflow-x:visible; overflow-y:auto; overscroll-behavior:contain; scrollbar-gutter:stable;}

.controls{display:grid; gap:12px;}
.search{display:flex; gap:8px; flex-wrap:wrap;}
input[type=text], button, select{
  border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--text);
  padding:10px 12px; font:inherit;
}
input[type=text]{flex:1; min-width:180px;}
button{cursor:pointer}
button:hover, select:hover{border-color:#b9d6e6; background:#fcfeff}
.langBtn{white-space:nowrap; font-weight:700;}

.rangeBox{border:1px solid var(--line); border-radius:14px; padding:12px; background:#fbfeff;}
.rangeLabel{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; color:var(--muted); font-size:12px;}
.rangeWrap{position:relative; height:34px; margin-top:2px;}
.track,.fill{position:absolute; left:0; right:0; top:50%; height:5px; transform:translateY(-50%); border-radius:999px;}
.track{background:#e4eef4}
.fill{background:linear-gradient(90deg, rgba(14,165,233,.25), rgba(14,165,233,.85));}
.rangeWrap input[type=range]{position:absolute; inset:0; width:100%; margin:0; appearance:none; background:none; pointer-events:none;}
.yearHist{position:relative; margin-top:10px; padding:8px 8px 6px; border-radius:12px; background:linear-gradient(180deg, rgba(248,252,255,.9), rgba(241,249,255,.72)); border:1px solid #e7f1f7;}
.yearBars{height:72px; display:grid; align-items:end; gap:0;}
.yearBar{position:relative; width:100%; min-height:2px; border-radius:0; background:linear-gradient(180deg, rgba(148,163,184,.42), rgba(148,163,184,.82)); transition:height .18s ease, opacity .18s ease, transform .18s ease, background .18s ease, box-shadow .18s ease;}
.yearBar:first-child{border-top-left-radius:4px;}
.yearBar:last-child{border-top-right-radius:4px;}
.yearBar.active{background:linear-gradient(180deg, rgba(125,211,252,.88), rgba(14,165,233,.98)); box-shadow:0 2px 8px rgba(14,165,233,.14);}
.yearBar.zero{min-height:1px; opacity:.35;}
.yearBar:hover{transform:translateY(-1px);}
.yearAxis{display:flex; justify-content:space-between; align-items:center; margin-top:6px; color:var(--muted); font-size:11px;}
.yearAxis span:last-child{text-align:right;}
.yearTooltip{position:absolute; left:0; top:0; z-index:8; min-width:98px; padding:8px 10px; border-radius:12px; background:rgba(16,33,47,.95); color:#fff; box-shadow:0 12px 28px rgba(15,23,42,.22); font-size:12px; line-height:1.25; pointer-events:none; opacity:0; transform:translate(-50%, -8px); transition:opacity .12s ease, transform .12s ease;}
.yearTooltip.show{opacity:1; transform:translate(-50%, -12px);}
.yearTooltipYear{font-weight:800; letter-spacing:.2px;}
.yearTooltipCount{margin-top:3px; color:rgba(255,255,255,.84);}
.yearFitOverlay{position:absolute; inset:8px 8px 24px 8px; width:calc(100% - 16px); height:64px; pointer-events:none; overflow:visible; z-index:2;}
.yearFitPath{fill:none; stroke:rgba(14,165,233,.95); stroke-width:0.75; vector-effect:non-scaling-stroke; stroke-linecap:round; stroke-linejoin:round;}
.yearFitLabel{position:absolute; left:10px; top:8px; z-index:3; max-width:min(78%, 360px); color:#0f2740; font-size:11px; line-height:1.28; pointer-events:none; background:none; border:none; box-shadow:none; padding:0;}
.yearFitLabel.hidden,.yearFitOverlay.hidden{display:none;}
.yearFitFormula{font-weight:700; letter-spacing:.1px;}
.yearFitR2{margin-top:1px; color:var(--muted);}
.rangeWrap input::-webkit-slider-thumb{
  appearance:none; width:16px; height:16px; border-radius:50%; background:var(--blue);
  border:2px solid #fff; box-shadow:0 0 0 1px rgba(14,165,233,.35); pointer-events:auto;
}
.rangeWrap input::-moz-range-thumb{width:16px; height:16px; border:none; border-radius:50%; background:var(--blue); pointer-events:auto;}

.filterGroup{border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-top:10px; background:#fbfeff;}
.filterHead{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  width:100%; border:none; background:#f8fcff; padding:10px 12px; cursor:pointer; font:inherit; font-weight:700;
}
.filterHead small{color:var(--muted); font-weight:400}
.filterBody{padding:10px 12px; border-top:1px solid #edf4f8;}
.groupSearch{width:100%; margin-bottom:8px; padding:8px 10px; border-radius:10px;}
.options{display:grid; gap:6px; max-height:220px; overflow:auto; padding-right:4px;}
.option{display:flex; align-items:flex-start; gap:8px; padding:2px 0; font-size:13px;}
.option input{margin-top:2px}
.option label{display:flex; justify-content:space-between; gap:8px; width:100%; cursor:pointer;}
.optionCount{color:var(--muted); white-space:nowrap}
.option.disabled{opacity:.45}
.selectedBox{margin-top:10px; font-size:12px; color:var(--muted);}
.selectedChip{display:inline-block; margin:4px 6px 0 0; padding:4px 8px; border-radius:999px; background:var(--chip); color:#065f8f; border:1px solid #ccecff;}

.toolbar{position:relative; z-index:50; display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:12px;}
.toolbarLeft,.toolbarRight{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.toolbarRight{position:relative; z-index:60;}
.vizMenu{position:relative; display:inline-flex; z-index:70;}
.vizTrigger{position:relative; z-index:72;}
.vizDropdown{
  position:absolute; top:calc(100% + 8px); right:0; min-width:132px;
  display:flex; flex-direction:column; gap:6px; padding:8px;
  border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.98);
  box-shadow:0 12px 28px rgba(15,23,42,.10);
  z-index:71;
  opacity:0; visibility:hidden; transform:translateY(-4px); pointer-events:none;
  transition:opacity .18s ease, transform .18s ease, visibility .18s ease;
}
.vizMenu.open .vizDropdown{
  opacity:1; visibility:visible; transform:translateY(0); pointer-events:auto;
}
.vizDropdown button{width:100%; text-align:left; white-space:nowrap;}
.stats{color:var(--muted); font-size:13px;}
.pill{display:inline-block; padding:4px 8px; border-radius:999px; background:var(--chip); border:1px solid #d6efff; color:#065f8f; font-size:12px; margin-right:6px}
.cards{display:grid; gap:10px;}
.card{border:1px solid var(--line); border-radius:16px; background:var(--card); padding:14px; box-shadow:0 6px 18px rgba(15,23,42,.04);}
.title{font-size:16px; font-weight:800; margin:0 0 8px;}
.meta{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
.meta .pill{margin-right:0}
.desc{color:#31475a; margin:8px 0 0; font-size:13px}
.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 14px; margin-top:10px;}
@media (max-width: 900px){ .grid{grid-template-columns:1fr;} }
.field{font-size:13px;}
.field b{display:inline-block; min-width:120px; color:var(--muted); font-weight:600}
a{color:#0284c7; text-decoration:none}
a:hover{text-decoration:underline}
.empty{border:1px dashed var(--line); border-radius:16px; padding:28px 16px; text-align:center; color:var(--muted); background:#fbfeff;}
.footer{margin-top:14px; color:var(--muted); font-size:12px;
  text-align:center;
  justify-content:center;
  align-items:center;
}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

.tableWrap{overflow:auto; border:1px solid var(--line); border-radius:16px; background:#fff;}
table{width:100%; border-collapse:collapse; min-width:980px;}
th,td{padding:10px 12px; border-bottom:1px solid #eef3f7; text-align:left; vertical-align:top; font-size:13px;}
th{background:#f8fcff; position:sticky; top:0; z-index:1;}
tbody tr:hover{background:#fbfeff;}

.resultsStage{opacity:1; transition:opacity .5s ease; will-change:opacity;}
.resultsStage.is-switching{opacity:0;}

.pagination{display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; margin-top:12px;}
.pageInfo{color:var(--muted); font-size:12px;}
.hidden{display:none;}

.loadingOverlay{
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(14,165,233,.18), transparent 55%),
    radial-gradient(1000px 600px at 100% 0%, rgba(2,132,199,.10), transparent 50%),
    rgba(244,251,255,.96);
  backdrop-filter: blur(10px);
  opacity:1; visibility:visible;
  transition:opacity .5s ease, visibility .5s ease;
}
.loadingOverlay.hidden{
  opacity:0; visibility:hidden; pointer-events:none;
}
.loadingPanel{
  width:min(520px, 92vw);
  background:rgba(255,255,255,.92);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 18px 48px rgba(15,23,42,.10);
  padding:26px 24px 22px;
}
.loadingTitle{
  margin:0 0 8px;
  font-size:22px;
  font-weight:800;
}
.loadingSub{
  margin:0 0 16px;
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
}
.loadingBar{
  position:relative;
  width:100%;
  height:12px;
  border-radius:999px;
  overflow:hidden;
  background:#e4eef4;
  border:1px solid #d7e5ef;
}
.loadingBarFill{
  width:0%;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg, rgba(125,211,252,.95), rgba(14,165,233,.98));
  transition:width .35s ease;
}
.loadingMeta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
}
.loadingPercent{
  color:var(--text);
  font-weight:800;
  font-variant-numeric: tabular-nums;
}

</style>
</head>
<body>

<div class="loadingOverlay" id="loadingOverlay" aria-live="polite">
  <div class="loadingPanel">
    <h2 class="loadingTitle" id="loadingTitle">正在加载 / Loading</h2>
    <p class="loadingSub" id="loadingSub">正在读取页面与数据，请稍候… / Loading page and data, please wait…</p>
    <div class="loadingBar" aria-hidden="true">
      <div class="loadingBarFill" id="loadingBarFill"></div>
    </div>
    <div class="loadingMeta">
      <span id="loadingStatus">准备中 / Preparing…</span>
      <span class="loadingPercent" id="loadingPercent">0%</span>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="head">
    <div class="headTop">
      <div>
        <div class="titleRow">
          <h1 id="titleMain"></h1>
          <a class="titleBadge" id="titleBadge" href="./index.html" target="_blank" rel="noopener noreferrer"></a>
          <a id="sourceEntryLink" class="sourceBadge" href="https://www.webofscience.com/" target="_blank" rel="noopener noreferrer"></a>
        </div>
        <p class="sub" id="subMain"></p>
        <p class="note" id="loadNote"></p>
      </div>
      <button id="langBtn" class="langBtn" type="button"></button>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="controls">
        <div class="search">
          <input id="q" type="text" />
          <button id="clearBtn" type="button"></button>
        </div>

        <div class="rangeBox">
          <div class="rangeLabel">
            <span id="yearLabel"></span>
            <span id="yearText">—</span>
          </div>
          <div class="rangeWrap">
            <div class="track"></div>
            <div class="fill" id="rangeFill"></div>
            <input id="yearMin" type="range" min="1900" max="2030" step="1" value="1900">
            <input id="yearMax" type="range" min="1900" max="2030" step="1" value="2030">
          </div>
          <div class="yearHist" id="yearHist">
            <svg class="yearFitOverlay hidden" id="yearFitOverlay" viewBox="0 0 100 64" preserveAspectRatio="none" aria-hidden="true">
              <path class="yearFitPath" id="yearFitPath"></path>
            </svg>
            <div class="yearFitLabel hidden" id="yearFitLabel" aria-hidden="true">
              <div class="yearFitFormula" id="yearFitFormula"></div>
              <div class="yearFitR2" id="yearFitR2"></div>
            </div>
            <div class="yearBars" id="yearBars"></div>
            <div class="yearTooltip" id="yearTooltip" aria-hidden="true"></div>
            <div class="yearAxis">
              <span id="yearAxisMin">—</span>
              <span id="yearAxisMax">—</span>
            </div>
          </div>
        </div>

        <div id="filters"></div>
        <div class="selectedBox" id="selectedBox"></div>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="toolbarLeft">
          <div class="stats" id="stats">—</div>
        </div>
        <div class="toolbarRight">
          <select id="sortSelect"></select>
          <button id="viewBtn" type="button"></button>
          <div class="vizMenu" id="vizMenu">
            <button id="sankeyBtn" class="vizTrigger" type="button" aria-haspopup="true" aria-expanded="false"></button>
            <div class="vizDropdown" id="vizDropdown">
              <button id="mapBtn" type="button"></button>
              <button id="sankeyOptionBtn" type="button"></button>
            </div>
          </div>
          <button id="exportBtn" type="button"></button>
        </div>
      </div>

      <div id="resultsStage" class="resultsStage">
        <div id="cards" class="cards"></div>

        <div id="tableWrap" class="tableWrap hidden">
        <table>
          <thead>
            <tr>
              <th id="thTitle"></th>
              <th id="thRegion"></th>
              <th id="thYear"></th>
              <th id="thDocType"></th>
              <th id="thLevel"></th>
              <th id="thTargeting"></th>
              <th id="thSource"></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

        <div class="pagination">
          <button id="prevBtn" type="button"></button>
          <span class="pageInfo" id="pageInfo"></span>
          <button id="nextBtn" type="button"></button>
        </div>
      </div>

    </main>
  </div>

  <div class="pageFooter" id="footerText"></div>
</div>

<script>
const GITHUB_REPO_OWNER = "3220001030";
const GITHUB_REPO_NAME = "dolphin";
const GITHUB_BRANCH = "main";

const RIS_BASE_NAMES = [
  "Sousa plumbea",
  "Sousa sahulensis",
  "Sousa teuszii",
  "Sousa chinensis taiwanensis",
  "Sousa chinensis"
];

const RIS_NUMBERED_MAX = 20;
const DATA_CANDIDATES = (() => {
  const names = new Set();
  for(const base of RIS_BASE_NAMES){
    names.add(`./${base}.ris`);
    for(let i = 1; i <= RIS_NUMBERED_MAX; i++){
      names.add(`./${base}${i}.ris`);
    }
  }
  return Array.from(names);
})();

const FILTERS = [
  "species_dataset","publication_type","language","source_title",
  "publisher","wos_index","institution","author_keyword"
];

function formatGitHubTimestamp(dateString, locale){
  if(!dateString) return "—";
  const d = new Date(dateString);
  if(Number.isNaN(d.getTime())) return "—";
  const zone = locale === 'zh' ? 'Asia/Shanghai' : 'UTC';
  const label = locale === 'zh' ? 'UTC+08:00' : 'UTC';
  const formatter = new Intl.DateTimeFormat(locale === 'zh' ? 'zh-CN' : 'en-GB', {
    timeZone: zone,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false
  });
  return `${formatter.format(d)} (${label})`;
}

function footerHtml(){
  if(!latestCommitInfo) return escapeHtml(t().footerLoading);
  if(latestCommitInfo.error) return escapeHtml(t().footerError);
  const cn = formatGitHubTimestamp(latestCommitInfo.date, 'zh');
  const en = formatGitHubTimestamp(latestCommitInfo.date, 'en');
  return escapeHtml(t().footerTemplate(cn, en));
}

async function loadLatestGitHubCommitTime(){
  const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/commits/${GITHUB_BRANCH}`;
  try{
    const res = await fetch(url, {
      headers: {
        'Accept': 'application/vnd.github+json'
      },
      cache: 'no-store'
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    latestCommitInfo = {
      date: data?.commit?.committer?.date || data?.commit?.author?.date || null,
      sha: data?.sha || ''
    };
  }catch(err){
    latestCommitInfo = { error: true, message: String(err?.message || err) };
  }
  updateFooter();
}

function norm(v){ return v === null || v === undefined ? "" : String(v).trim(); }
function normKey(v){ return norm(v).toLowerCase(); }
function escapeHtml(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[m])); }
function parseYear(v){
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  if (s === "") return null;
  const m = s.match(/\d{4}/);
  if(!m) return null;
  const n = Number(m[0]);
  return Number.isFinite(n) ? n : null;
}
function maybeTranslate(value){
  const v = norm(value);
  if(lang === "zh") return v;
  return VALUE_MAP_EN[v] || v;
}
function displayTargeting(v){
  return maybeTranslate(norm(v)) || "—";
}
function getFilterRawValue(r, key){
  return norm(r?.[key]) || "（空）";
}
function getFilterMatchValue(r, key){

}
function getFilterDisplayValue(key, rawValue){
  const v = norm(rawValue) || "（空）";

}
function normalizeSelectionValue(key, value){

}
function normalizeAllSelections(){
  for(const key of FILTERS){
    const current = Array.from(selections.get(key) || []);
    const next = new Set(current.map(v => normalizeSelectionValue(key, v)).filter(Boolean));

  }
}
function inferSpeciesLabel(path){
  const file = String(path).split('/').pop().replace(/\.ris$/i, '');
  return file.replace(/\d+$/, '');
}
function publicationTypeLabel(code){
  const ty = norm(code).toUpperCase();
  if(ty === 'JOUR') return '期刊论文';
  if(ty === 'CPAPER' || ty === 'CONF') return '会议论文';
  if(ty === 'BOOK' || ty === 'CHAP') return '书籍/章节';
  return '其他';
}
function splitMultilineValues(value){
  return String(value || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
}
function pushTaggedValue(record, tag, value){
  if(record[tag] === undefined){
    record[tag] = value;
  }else if(Array.isArray(record[tag])){
    record[tag].push(value);
  }else{
    record[tag] = [record[tag], value];
  }
}
function parseRisRecords(text, path){
  const clean = String(text || '').replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = clean.split('\n');
  const out = [];
  let record = null;
  let currentTag = null;

  const flushRecord = () => {
    if(!record) return;
    const getFirst = (...keys) => {
      for(const key of keys){
        const v = record[key];
        if(Array.isArray(v)) return norm(v[0]);
        if(v !== undefined) return norm(v);
      }
      return '';
    };
    const getAll = (...keys) => {
      const values = [];
      for(const key of keys){
        const v = record[key];
        if(v === undefined) continue;
        if(Array.isArray(v)) values.push(...v.flatMap(splitMultilineValues));
        else values.push(...splitMultilineValues(v));
      }
      return values.map(norm).filter(Boolean);
    };

    const n1 = getAll('N1').join('\n');
    const citedMatch = n1.match(/Times Cited in Web of Science Core Collection:\s*(\d+)/i);
    const totalCitedMatch = n1.match(/Total Times Cited:\s*(\d+)/i);
    const refCountMatch = n1.match(/Cited Reference Count:\s*(\d+)/i);

    const doi = getFirst('DO');
    const accession = getFirst('AN');
    const url = doi ? `https://doi.org/${doi}` : (accession ? `https://www.webofscience.com/wos/woscc/full-record/${encodeURIComponent(accession)}` : '');

    const authors = getAll('AU');
    const institutions = Array.from(new Set(getAll('C3', 'AD')));
    const keywords = Array.from(new Set(getAll('KW')));
    const sourceTitle = getFirst('T2', 'JO', 'JF', 'J9', 'JA', 'BT');
    const language = getFirst('LA');
    const wosIndex = getFirst('WE');

    const row = {
      species_dataset: inferSpeciesLabel(path),
      publication_type: publicationTypeLabel(getFirst('TY')),
      language: language || '（空）',
      source_title: sourceTitle || '（空）',
      publisher: getFirst('PU') || '（空）',
      wos_index: wosIndex || '（空）',
      institution: institutions.length ? institutions.join('; ') : '（空）',
      author_keyword: keywords[0] || '（空）',
      year: getFirst('PY'),
      document_title: getFirst('TI') || getFirst('T1'),
      document_type: publicationTypeLabel(getFirst('TY')),
      hierarchy_level: sourceTitle || '（空）',
      targeting_category: wosIndex || '（空）',
      function_type: authors.join('; '),
      taxon_label_used_in_text: keywords.join('; '),
      source_url: url,
      notes: getFirst('AB'),
      doi,
      accession,
      authors,
      keywords,
      institutions,
      abstract: getFirst('AB'),
      volume: getFirst('VL'),
      issue: getFirst('IS'),
      pages: getFirst('SP'),
      article_number: getFirst('C7'),
      publication_day: getFirst('DA'),
      times_cited_wos: citedMatch ? citedMatch[1] : '0',
      total_times_cited: totalCitedMatch ? totalCitedMatch[1] : '0',
      cited_reference_count: refCountMatch ? refCountMatch[1] : '0',
      file_source: String(path).replace(/^\.\//, '')
    };
    if(norm(row.document_title) || norm(row.source_title)) out.push(row);
  };

  for(const rawLine of lines){
    const line = rawLine || '';
    const tagMatch = line.match(/^([A-Z0-9]{2})\s{2}-\s?(.*)$/);
    if(tagMatch){
      const tag = tagMatch[1];
      const value = tagMatch[2] || '';
      if(tag === 'TY'){
        flushRecord();
        record = {};
      }else if(!record){
        record = {};
      }
      currentTag = tag;
      pushTaggedValue(record, tag, value);
      if(tag === 'ER'){
        flushRecord();
        record = null;
        currentTag = null;
      }
    }else if(record && currentTag){
      const extra = line.trim();
      if(!extra) continue;
      if(Array.isArray(record[currentTag])){
        const idx = record[currentTag].length - 1;
        record[currentTag][idx] = `${record[currentTag][idx]}\n${extra}`;
      }else{
        record[currentTag] = `${record[currentTag]}\n${extra}`;
      }
    }
  }
  flushRecord();
  return out;
}
async function loadDataWithProgress(){
  const totalCandidates = Math.max(1, DATA_CANDIDATES.length);
  const startBase = 10;
  const endBase = 88;
  const candidateSpan = (endBase - startBase) / totalCandidates;
  let allRows = [];
  let loadedFiles = [];
  for(let i = 0; i < DATA_CANDIDATES.length; i++){
    const path = DATA_CANDIDATES[i];
    const baseStart = startBase + candidateSpan * i;
    const baseEnd = baseStart + candidateSpan;
    try{
      updateLoading(baseStart, 'loadingFetchingData');
      const res = await fetch(path, { cache:'no-store' });
      if(!res.ok) continue;
      const risText = await res.text();
      updateLoading(baseStart + candidateSpan * 0.7, 'loadingParsingData');
      const rowsFromFile = parseRisRecords(risText, path);
      if(rowsFromFile.length){
        allRows = allRows.concat(rowsFromFile);
        loadedFiles.push(path);
      }
      updateLoading(baseEnd, 'loadingParsingData');
    }catch(e){}
  }
  loadedPath = loadedFiles.map(v => v.replace(/^\.\//, '')).join(', ');
  if(allRows.length) return allRows;
  throw new Error("No available RIS file");
}

function getComparableValue(r, key){
  return getFilterDisplayValue(key, getFilterRawValue(r, key));
}
function getUniqueValues(key){
  const set = new Set();
  rows.forEach(r => {
    if(key === "institution" && Array.isArray(r.institutions) && r.institutions.length){
      r.institutions.forEach(v => set.add(norm(v) || "（空）"));
    }else{
      set.add(getFilterRawValue(r, key));
    }
  });
  return Array.from(set).sort((a,b)=>getFilterDisplayValue(key, a).localeCompare(getFilterDisplayValue(key, b), lang === 'zh' ? 'zh-CN' : 'en'));
}
function rowMatchesSearch(r){
  const q = norm(el.q.value).toLowerCase();
  if(!q) return true;
  const pool = [
    r.document_title, r.source_title, r.document_type, r.publication_type,
    r.hierarchy_level, r.targeting_category, r.wos_index,
    r.function_type, r.taxon_label_used_in_text, r.notes, r.source_url, r.language,
    r.publisher, r.doi, r.accession, r.file_source, r.species_dataset,
    ...(Array.isArray(r.authors) ? r.authors : []),
    ...(Array.isArray(r.keywords) ? r.keywords : []),
    ...(Array.isArray(r.institutions) ? r.institutions : [])
  ].map(v => norm(v).toLowerCase()).join(" | ");
  return pool.includes(q);
}
function rowMatchesYear(r){
  const y = parseYear(r.year);
  if(y === null) return true;
  return y >= minYear && y <= maxYear;
}
function rowMatchesSelections(r, ignoreKey=null){
  for(const key of FILTERS){
    if(key === ignoreKey) continue;
    const sel = selections.get(key);
    if(!sel || sel.size === 0) continue;
    if(key === "institution"){
      const insts = Array.isArray(r.institutions) && r.institutions.length
        ? r.institutions.map(v => normKey(v))
        : [getFilterMatchValue(r, key)];
      if(!insts.some(v => sel.has(v))) return false;
      continue;
    }
    const val = getFilterMatchValue(r, key);
    if(!sel.has(val)) return false;
  }
  return true;
}
function sortRows(arr){
  arr.sort((a,b) => {
    if(sortMode === "year_desc"){
      return (parseYear(b.year) ?? -Infinity) - (parseYear(a.year) ?? -Infinity);
    }
    if(sortMode === "year_asc"){
      return (parseYear(a.year) ?? Infinity) - (parseYear(b.year) ?? Infinity);
    }
    if(sortMode === "title_asc"){
      return norm(a.document_title).localeCompare(norm(b.document_title), lang === "zh" ? 'zh-CN' : 'en');
    }
    if(sortMode === "title_desc"){
      return norm(b.document_title).localeCompare(norm(a.document_title), lang === "zh" ? 'zh-CN' : 'en');
    }
    if(sortMode === "region_asc"){
      const ra = (maybeTranslate(a.source_title) + " " + maybeTranslate(a.publisher)).trim();
      const rb = (maybeTranslate(b.source_title) + " " + maybeTranslate(b.publisher)).trim();
      return ra.localeCompare(rb, lang === "zh" ? 'zh-CN' : 'en');
    }
    return 0;
  });
}
function applyFilters(){
  filtered = rows.filter(r => rowMatchesSearch(r) && rowMatchesYear(r) && rowMatchesSelections(r));

}

function renderFilters(){

      if(!rowMatchesSearch(r) || !rowMatchesYear(r) || !rowMatchesSelections(r, key)) return;
      if(key === "institution" && Array.isArray(r.institutions) && r.institutions.length){
        r.institutions.forEach(inst => {
          const v = norm(inst) || "（空）";
          counts.set(v, (counts.get(v) || 0) + 1);
        });
      }else{
        const v = getFilterRawValue(r, key);
        counts.set(v, (counts.get(v) || 0) + 1);
      }
    });
    container.innerHTML = values.filter(v => !searchText || v.toLowerCase().includes(searchText)).map(v => {
      const count = counts.get(v) || 0;
      const checked = selections.get(key).has(normKey(v));
      const disabled = count === 0 && !checked;
      const safeId = makeSafeId(key, v);
      return `
        <div class="option ${disabled ? 'disabled' : ''}">
          <input ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''} type="checkbox" id="${safeId}" data-key="${key}" data-val="${escapeHtml(normKey(v))}">
          <label for="${safeId}">
            <span>${escapeHtml(getFilterDisplayValue(key, v))}</span>
            <span class="optionCount">${count}</span>
          </label>
        </div>`;
    }).join("") || `<div class="option disabled"><label><span>${escapeHtml(t().noMatchOption)}</span><span class="optionCount">0</span></label></div>`;
    container.querySelectorAll('input[type="checkbox"]').forEach(box => {
      box.addEventListener('mousedown', e => e.preventDefault());
      box.addEventListener('change', e => {
        const k = e.target.dataset.key, v = e.target.dataset.val;
        if(e.target.checked) selections.get(k).add(v); else selections.get(k).delete(v);
        page = 1;
        renderAll({ animateMain: true });
      });
    });
  }
  renderSelected();
  if(el.sidebar) el.sidebar.scrollTop = sidebarScrollTop;
}
function getPageRows(){

  if(page > totalPages) page = totalPages;

  const start = (page - 1) * pageSize;
  return filtered.slice(start, start + pageSize);

function renderPagination(){
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));

  el.prevBtn.disabled = page <= 1;
  el.nextBtn.disabled = page >= totalPages;
}
function getYearCounts(){
  const counts = new Map();
  const years = rows.map(r => parseYear(r.year)).filter(v => v !== null);
  if(!years.length) return [];
  const start = Math.min(...years);
  const end = Math.max(...years);
  for(let y = start; y <= end; y++) counts.set(y, 0);
  rows.forEach(r => {
    const y = parseYear(r.year);
    if(y === null) return;
    if(!rowMatchesSearch(r) || !rowMatchesSelections(r)) return;
    counts.set(y, (counts.get(y) || 0) + 1);
  });
  return Array.from(counts.entries()).map(([year, count]) => ({ year, count }));
}
function formatFitNumber(value){
  if(!Number.isFinite(value)) return "—";
  const abs = Math.abs(value);
  if(abs >= 1000 || (abs > 0 && abs < 0.001)) return value.toExponential(2);
  if(abs >= 100) return value.toFixed(1);
  if(abs >= 10) return value.toFixed(2);
  return value.toFixed(3);
}
function getYearFitSeries(){
  const series = getYearCounts();
  if(!series.length) return { series, fit: null };
  const positiveYears = series.filter(d => d.count > 0).map(d => d.year);
  const latestYear = positiveYears.length ? Math.max(...positiveYears) : series[series.length - 1].year;
  const candidates = series.filter(d => d.year !== latestYear && d.count > 0);
  if(candidates.length < 2) return { series, fit: null };

  const x0 = candidates[0].year;
  const xs = candidates.map(d => d.year - x0);
  const ys = candidates.map(d => d.count);
  const lnYs = ys.map(Math.log);
  const n = xs.length;
  const sumX = xs.reduce((a,b)=>a+b,0);
  const sumY = lnYs.reduce((a,b)=>a+b,0);
  const sumXX = xs.reduce((a,b)=>a + b*b, 0);
  const sumXY = xs.reduce((a,b,i)=>a + b*lnYs[i], 0);
  const denom = n * sumXX - sumX * sumX;
  if(!Number.isFinite(denom) || Math.abs(denom) < 1e-12) return { series, fit: null };

  const b = (n * sumXY - sumX * sumY) / denom;
  const lnA = (sumY - b * sumX) / n;
  const a = Math.exp(lnA);
  if(!Number.isFinite(a) || !Number.isFinite(b)) return { series, fit: null };

  const predict = (year) => a * Math.exp(b * (year - x0));
  const yMean = ys.reduce((acc, val) => acc + val, 0) / ys.length;
  const ssRes = ys.reduce((acc, val, i) => {
    const diff = val - predict(candidates[i].year);
    return acc + diff * diff;
  }, 0);
  const ssTot = ys.reduce((acc, val) => {
    const diff = val - yMean;
    return acc + diff * diff;
  }, 0);
  const r2 = ssTot > 0 ? 1 - (ssRes / ssTot) : 1;

  return {
    series,
    fit: {
      x0, a, b, r2, latestYear,
      formula: `y = ${a.toFixed(2)} · e^(${b.toFixed(2)} · (x - ${x0}))`
    }
  };
}
function renderYearFit(series, fit){
  if(!el.yearFitOverlay || !el.yearFitPath || !el.yearFitLabel || !el.yearFitFormula || !el.yearFitR2) return;
  if(!series.length || !fit){
    el.yearFitOverlay.classList.add('hidden');
    el.yearFitLabel.classList.add('hidden');
    el.yearFitPath.setAttribute('d', '');
    return;
  }
  const barMax = Math.max(...series.map(d => d.count), 0);
  if(barMax <= 0){
    el.yearFitOverlay.classList.add('hidden');
    el.yearFitLabel.classList.add('hidden');
    el.yearFitPath.setAttribute('d', '');
    return;
  }
  const width = series.length;
  const height = 64;
  const predict = (year) => fit.a * Math.exp(fit.b * (year - fit.x0));
  const fitValues = series.map(d => Math.max(0, predict(d.year)));
  const fitMax = Math.max(...fitValues, 0);
  const scaleMax = Math.max(barMax, fitMax);
  if(scaleMax <= 0){
    el.yearFitOverlay.classList.add('hidden');
    el.yearFitLabel.classList.add('hidden');
    el.yearFitPath.setAttribute('d', '');
    return;
  }
  const points = series.map((d, idx) => {
    const x = series.length === 1 ? width / 2 : idx + 0.5;
    const yPred = fitValues[idx];
    const y = height - (yPred / scaleMax) * height;
    return [x, Math.max(0.5, Math.min(height - 0.5, y))];
  });
  const d = points.map((pt, idx) => `${idx === 0 ? 'M' : 'L'} ${pt[0].toFixed(3)} ${pt[1].toFixed(3)}`).join(' ');
  el.yearFitOverlay.setAttribute('viewBox', `0 0 ${width} ${height}`);
  el.yearFitPath.setAttribute('d', d);
  el.yearFitOverlay.classList.remove('hidden');
  el.yearFitFormula.textContent = fit.formula;
  el.yearFitR2.textContent = `R² = ${Number.isFinite(fit.r2) ? fit.r2.toFixed(2) : '—'}`;
  el.yearFitLabel.classList.remove('hidden');
}
function showYearTooltip(target){
  if(!target){
    el.yearTooltip.classList.remove('show');
    el.yearTooltip.setAttribute('aria-hidden', 'true');
    return;
  }
  const year = target.dataset.year;
  const count = target.dataset.count;
  el.yearTooltip.innerHTML = `<div class="yearTooltipYear">${escapeHtml(year)}</div><div class="yearTooltipCount">${escapeHtml(t().yearCount)}: ${escapeHtml(count)}</div>`;
  const histRect = el.yearHist.getBoundingClientRect();
  const barRect = target.getBoundingClientRect();
  const tooltipWidth = el.yearTooltip.offsetWidth || 98;
  const x = Math.min(Math.max(barRect.left - histRect.left + (barRect.width / 2), tooltipWidth / 2 + 6), histRect.width - tooltipWidth / 2 - 6);
  const y = Math.max(8, barRect.top - histRect.top - 4);
  el.yearTooltip.style.left = `${x}px`;
  el.yearTooltip.style.top = `${y}px`;
  el.yearTooltip.classList.add('show');
  el.yearTooltip.setAttribute('aria-hidden', 'false');
}
function bindYearHistogramTooltip(){
  if(el.yearBars.dataset.bound === '1') return;
  el.yearBars.dataset.bound = '1';
  el.yearBars.addEventListener('mousemove', e => {
    const bar = e.target.closest('.yearBar');
    if(!bar){
      showYearTooltip(null);
      return;
    }
    showYearTooltip(bar);
  });
  el.yearBars.addEventListener('mouseleave', () => showYearTooltip(null));
}
function renderYearHistogram(){
  const { series, fit } = getYearFitSeries();
  if(!series.length){
    el.yearHist.classList.add('hidden');
    renderYearFit([], null);
    showYearTooltip(null);
    return;
  }
  el.yearHist.classList.remove('hidden');
  el.yearAxisMin.textContent = String(series[0].year);
  el.yearAxisMax.textContent = String(series[series.length - 1].year);
  el.yearBars.style.gridTemplateColumns = `repeat(${series.length}, minmax(0, 1fr))`;
  const maxCount = Math.max(...series.map(d => d.count), 0);
  el.yearBars.innerHTML = series.map(d => {
    const active = d.year >= minYear && d.year <= maxYear;
    const height = maxCount > 0 && d.count > 0 ? Math.max(6, Math.round((d.count / maxCount) * 64)) : 2;
    const classes = ['yearBar'];
    if(active) classes.push('active');
    if(d.count === 0) classes.push('zero');
    const label = `${d.year}: ${d.count}`;
    return `<div class="${classes.join(' ')}" style="height:${height}px" data-year="${escapeHtml(String(d.year))}" data-count="${escapeHtml(String(d.count))}" aria-label="${escapeHtml(label)}"></div>`;
  }).join('');
  renderYearFit(series, fit);
  showYearTooltip(null);
}
function updateRangeUI(){
  if(minYear > maxYear){ const tmp=minYear; minYear=maxYear; maxYear=tmp; }
  el.yearMin.value = minYear; el.yearMax.value = maxYear;
  el.yearText.textContent = `${minYear} — ${maxYear}`;
  const min = Number(el.yearMin.min), max = Number(el.yearMin.max);
  const left = ((minYear - min) / (max - min)) * 100;
  const right = ((maxYear - min) / (max - min)) * 100;
  el.rangeFill.style.left = `${left}%`;
  el.rangeFill.style.right = `${100 - right}%`;
}
function renderMainView(){
  el.stats.textContent = t().stats(filtered.length, rows.length);
  el.sankeyBtn.disabled = filtered.length === 0;
  if(el.mapBtn) el.mapBtn.disabled = filtered.length === 0;
  if(el.sankeyOptionBtn) el.sankeyOptionBtn.disabled = filtered.length === 0;
  if(viewMode === "card"){
    el.cards.classList.remove("hidden");
    el.tableWrap.classList.add("hidden");
    renderCards();
  }else{
    el.cards.classList.add("hidden");
    el.tableWrap.classList.remove("hidden");
    renderTable();
  }
  renderPagination();
}

let transitionTimer = null;
const MAIN_FADE_HALF_MS = 250;

function shouldAnimateMain(next = {}){
  return !!next.animateMain && !!el.resultsStage && !el.loadingOverlay?.classList.contains('hidden') === false;
}

function runMainFadeSwitch(nextRender){
  if(!el.resultsStage){
    nextRender();
    return;
  }
  if(transitionTimer){
    clearTimeout(transitionTimer);
    transitionTimer = null;
  }
  const stage = el.resultsStage;
  const lockHeight = stage.offsetHeight;
  if(lockHeight > 0) stage.style.minHeight = `${lockHeight}px`;
  stage.classList.add('is-switching');
  transitionTimer = setTimeout(() => {
    nextRender();
    requestAnimationFrame(() => {
      stage.classList.remove('is-switching');
      requestAnimationFrame(() => {
        stage.style.minHeight = '';
      });
    });
    transitionTimer = null;
  }, MAIN_FADE_HALF_MS);
}

function renderAll(options = {}){
  normalizeAllSelections();
  applyStaticTexts();
  updateRangeUI();
  applyFilters();
  renderYearHistogram();
  renderFilters();

  const renderMainOnly = () => {
    renderMainView();
  };

  if(options.animateMain){
    runMainFadeSwitch(renderMainOnly);
  }else{
    renderMainOnly();
  }
}
function buildVisualizationPayload(){
  return {
    lang,
    q: norm(el.q.value),
    minYear,
    maxYear,
    loadedPath,
    filters: Object.fromEntries(FILTERS.map(key => [key, Array.from(selections.get(key) || [])])),
    generatedAt: Date.now()
  };
}

function storeVisualizationState(payload){
  try{
    const encoded = JSON.stringify(payload);
    sessionStorage.setItem('wd_visual_state', encoded);
    localStorage.setItem('wd_visual_state', encoded);
    sessionStorage.setItem('wd_sankey_state', encoded);
    localStorage.setItem('wd_sankey_state', encoded);
    sessionStorage.setItem('wd_map_state', encoded);
    localStorage.setItem('wd_map_state', encoded);
    localStorage.setItem('wd_lang', lang);
  }catch(err){
    console.warn('Unable to store visualization state', err);
  }
}

function openVisualizationPage(target){
  const payload = buildVisualizationPayload();
  storeVisualizationState(payload);
  window.open(target, '_blank');
}

function openSankeyView(){
  openVisualizationPage('./sankey.html');
}

function openMapView(){
  openVisualizationPage('./map.html');
}

function exportCsv(){
  const cols = [
    "species_dataset","publication_type","language","year","document_title",
    "source_title","publisher","wos_index","function_type","taxon_label_used_in_text",
    "institution","doi","accession","times_cited_wos","total_times_cited",
    "cited_reference_count","source_url","notes","file_source"
  ];
  const esc = v => {
    const s = norm(v);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  };
  const csv = [cols.join(",")].concat(filtered.map(r => cols.map(c => esc(r[c])).join(","))).join("\n");
  const blob = new Blob(["\ufeff" + csv], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = lang === "zh" ? "当前筛选结果.csv" : "filtered_results.csv";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}
function initYears(){
  const years = rows.map(r => parseYear(r.year)).filter(v => v !== null);
  minYear = years.length ? Math.min(...years) : 1900;
  maxYear = years.length ? Math.max(...years) : 2030;
  el.yearMin.min = el.yearMax.min = String(minYear);
  el.yearMin.max = el.yearMax.max = String(maxYear);
  el.yearMin.value = String(minYear);
  el.yearMax.value = String(maxYear);
}

let loadingValue = 0;

function updateLoading(progress, statusKey){
  loadingValue = Math.max(0, Math.min(100, Number(progress) || 0));
  const pctText = `${loadingValue.toFixed(2)}%`;
  if(el.loadingPercent) el.loadingPercent.textContent = pctText;
  if(el.loadingBarFill) el.loadingBarFill.style.width = `${loadingValue}%`;
  if(el.loadingTitle) el.loadingTitle.textContent = `${t().loadingTitle} / ${t().loadingTitleEn}`;
  if(el.loadingSub) el.loadingSub.textContent = `${t().loadingSub} / ${t().loadingSubEn}`;
  if(el.loadingStatus && statusKey){
    const a = t()[statusKey] || '';
    const b = t()[`${statusKey}En`] || '';
    el.loadingStatus.textContent = b ? `${a} / ${b}` : a;
  }
}
function hideLoadingOverlay(){
  updateLoading(100, 'loadingDone');
  if(el.loadingOverlay){
    setTimeout(() => el.loadingOverlay.classList.add('hidden'), 120);
  }
}

async function main(){
  updateLoading(2.00, 'loadingPreparing');
  buildFilterShell();
  updateLoading(9.00, 'loadingPageReady');

  rows = await loadDataWithProgress();

  initYears();
  bindYearHistogramTooltip();
  loadLatestGitHubCommitTime();
  updateLoading(92.00, 'loadingRendering');

  el.q.addEventListener('input', () => { page = 1; renderAll({ animateMain: true }); });
  el.filters.addEventListener('click', (e) => {
    const interactive = e.target.closest('button, input, label, select, a');
    if(interactive) e.stopPropagation();
  });
  el.clearBtn.addEventListener('click', () => {
    el.q.value = "";
    for(const key of FILTERS) selections.get(key).clear();
    el.filters.querySelectorAll('.groupSearch').forEach(i => i.value = "");
    minYear = Number(el.yearMin.min);
    maxYear = Number(el.yearMax.max);
    page = 1;
    renderAll({ animateMain: true });
  });
  el.yearMin.addEventListener('input', () => { minYear = Math.min(Number(el.yearMin.value), Number(el.yearMax.value)); page = 1; renderAll({ animateMain: true }); });
  el.yearMax.addEventListener('input', () => { maxYear = Math.max(Number(el.yearMax.value), Number(el.yearMin.value)); page = 1; renderAll({ animateMain: true }); });
  const closeVizMenu = () => {
    if(el.vizMenu) el.vizMenu.classList.remove('open');
    if(el.sankeyBtn) el.sankeyBtn.setAttribute('aria-expanded', 'false');
  };
  const openVizMenu = () => {
    if(el.vizMenu) el.vizMenu.classList.add('open');
    if(el.sankeyBtn) el.sankeyBtn.setAttribute('aria-expanded', 'true');
  };
  const toggleVizMenu = () => {
    if(!el.vizMenu) return;
    const willOpen = !el.vizMenu.classList.contains('open');
    if(willOpen) openVizMenu();
    else closeVizMenu();
  };

  el.sankeyBtn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    toggleVizMenu();
  });
  if(el.mapBtn) el.mapBtn.addEventListener('click', (e) => { e.stopPropagation(); closeVizMenu(); openMapView(); });
  if(el.sankeyOptionBtn) el.sankeyOptionBtn.addEventListener('click', (e) => { e.stopPropagation(); closeVizMenu(); openSankeyView(); });
  if(el.sankeyBtn){
    el.sankeyBtn.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown'){
        e.preventDefault();
        openVizMenu();
        if(el.mapBtn) el.mapBtn.focus();
      } else if(e.key === 'Escape'){
        closeVizMenu();
        el.sankeyBtn.focus();
      }
    });
  }
  document.addEventListener('click', (e) => {
    if(el.vizMenu && !el.vizMenu.contains(e.target)) closeVizMenu();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeVizMenu();
  });
  el.exportBtn.addEventListener('click', exportCsv);
  el.langBtn.addEventListener('click', () => {
    lang = lang === "zh" ? "en" : "zh";
    localStorage.setItem("wd_lang", lang);
    page = 1;
    renderAll({ animateMain: true });
  });
  el.viewBtn.addEventListener('click', () => {
    viewMode = viewMode === "card" ? "table" : "card";
    localStorage.setItem("wd_view", viewMode);
    renderAll({ animateMain: true });
  });
  el.sortSelect.addEventListener('change', () => {
    sortMode = el.sortSelect.value;
    localStorage.setItem("wd_sort", sortMode);
    page = 1;
    renderAll({ animateMain: true });
  });
  el.prevBtn.addEventListener('click', () => { if(page > 1){ page--; renderMainView(); } });
  el.nextBtn.addEventListener('click', () => { const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize)); if(page < totalPages){ page++; renderMainView(); } });

  renderAll();
  updateLoading(99.20, 'loadingRendering');
  hideLoadingOverlay();
}
main().catch(err => {
  applyStaticTexts();
  updateLoading(100, 'loadingDone');
  if(el.loadingStatus) el.loadingStatus.textContent = t().loadFail + err.message;
  if(el.loadingSub) el.loadingSub.innerHTML = t().loadFailTip;
  el.loadNote.textContent = t().loadFail + err.message;
  el.cards.innerHTML = `<div class="empty">${t().loadFailTip}</div>`;
});
