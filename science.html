<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>白海豚保育政策/科学文本数据库</title>
<style>
:root{
  --bg:#f4fbff; --card:#ffffff; --line:#d7e5ef; --muted:#5b7285; --text:#10212f;
  --blue:#0ea5e9; --chip:#eef8ff; --warn:#b45309; --danger:#b91c1c;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--text);
  font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(14,165,233,.18), transparent 55%),
    radial-gradient(1000px 600px at 100% 0%, rgba(2,132,199,.10), transparent 50%),
    var(--bg);
  overflow-x:hidden;
  overflow-y:auto;
}
.wrap{max-width:1450px; margin:0 auto; padding:20px 16px 28px; min-height:100vh;}
.head,.sidebar,.main,.pageFooter{
  background:rgba(255,255,255,.88); border:1px solid var(--line); border-radius:18px;
  backdrop-filter: blur(8px); box-shadow:0 10px 28px rgba(15,23,42,.05);
}
.head{padding:18px 18px 14px; margin-bottom:14px;}
.headTop{display:flex; justify-content:space-between; gap:12px; align-items:flex-start;}
h1{margin:0 0 6px; font-size:28px}
.titleLink{color:inherit; text-decoration:none;}
.titleLink:hover{text-decoration:underline}
.titleLinkScience{color:#9ca3af;}
.titleLinkScience:hover{color:#6b7280;}
.sub{margin:0; color:var(--muted)}
.note{margin:8px 0 0; color:var(--muted); font-size:12px}
.layout{display:grid; grid-template-columns:320px 1fr; gap:14px; align-items:start; min-height:calc(100vh - 160px);}
@media (max-width: 960px){
  .layout{grid-template-columns:1fr; min-height:auto;}
  .headTop{flex-direction:column;}
  body{overflow:auto;}
  .sidebar,.main{max-height:none; overflow:visible;}
  .pageFooter{margin-top:14px;}
}
.sidebar,.main{min-height:0;}
.pageFooter{
  padding:12px 14px; margin-top:14px; color:var(--muted); font-size:12px;
  text-align:center; display:flex; align-items:center; justify-content:center;
}
.sidebar{padding:14px; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto;}
.main{padding:14px; max-height:calc(100vh - 24px); overflow-x:visible; overflow-y:auto;}

.controls{display:grid; gap:12px;}
.search{display:flex; gap:8px; flex-wrap:wrap;}
input[type=text], input[type=file], button, select{
  border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--text);
  padding:10px 12px; font:inherit;
}
input[type=text]{flex:1; min-width:180px;}
button{cursor:pointer}
button:hover, select:hover, input[type=file]:hover{border-color:#b9d6e6; background:#fcfeff}
.langBtn{white-space:nowrap; font-weight:700;}
.uploadBox,.rangeBox,.filterGroup,.noticeBox{border:1px solid var(--line); border-radius:14px; padding:12px; background:#fbfeff;}
.uploadRow{display:grid; gap:8px}
.uploadMeta{color:var(--muted); font-size:12px}
.noticeBox strong{display:block; margin-bottom:4px}
.noticeBox.warning{background:#fff9ed; border-color:#f2d39b; color:#8a5a00}
.noticeBox.error{background:#fff5f5; border-color:#fecaca; color:#991b1b}
.rangeLabel{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; color:var(--muted); font-size:12px;}
.rangeWrap{position:relative; height:34px; margin-top:2px;}
.track,.fill{position:absolute; left:0; right:0; top:50%; height:5px; transform:translateY(-50%); border-radius:999px;}
.track{background:#e4eef4}
.fill{background:linear-gradient(90deg, rgba(14,165,233,.25), rgba(14,165,233,.85));}
.rangeWrap input[type=range]{position:absolute; inset:0; width:100%; margin:0; appearance:none; background:none; pointer-events:none;}
.rangeWrap input::-webkit-slider-thumb{
  appearance:none; width:16px; height:16px; border-radius:50%; background:var(--blue);
  border:2px solid #fff; box-shadow:0 0 0 1px rgba(14,165,233,.35); pointer-events:auto;
}
.rangeWrap input::-moz-range-thumb{width:16px; height:16px; border:none; border-radius:50%; background:var(--blue); pointer-events:auto;}
.filterGroup h3{margin:0 0 8px; font-size:14px}
.options{display:grid; gap:6px; max-height:220px; overflow:auto; padding-right:4px;}
.option{display:flex; align-items:flex-start; gap:8px; padding:2px 0; font-size:13px;}
.option input{margin-top:2px}
.option label{display:flex; justify-content:space-between; gap:8px; width:100%; cursor:pointer;}
.optionCount{color:var(--muted); white-space:nowrap}
.option.disabled{opacity:.45}
.selectedBox{margin-top:10px; font-size:12px; color:var(--muted);}
.selectedChip{display:inline-block; margin:4px 6px 0 0; padding:4px 8px; border-radius:999px; background:var(--chip); color:#065f8f; border:1px solid #ccecff;}
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:12px;}
.toolbarLeft,.toolbarRight{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.stats{color:var(--muted); font-size:13px;}
.pill{display:inline-block; padding:4px 8px; border-radius:999px; background:var(--chip); border:1px solid #d6efff; color:#065f8f; font-size:12px; margin-right:6px}
.cards{display:grid; gap:10px;}
.card{border:1px solid var(--line); border-radius:16px; background:var(--card); padding:14px; box-shadow:0 6px 18px rgba(15,23,42,.04);}
.title{font-size:16px; font-weight:800; margin:0 0 8px;}
.meta{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
.meta .pill{margin-right:0}
.desc{color:#31475a; margin:8px 0 0; font-size:13px}
.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 14px; margin-top:10px;}
@media (max-width: 900px){ .grid{grid-template-columns:1fr;} }
.field{font-size:13px;}
.field b{display:inline-block; min-width:120px; color:var(--muted); font-weight:600}
a{color:#0284c7; text-decoration:none}
a:hover{text-decoration:underline}
.empty{border:1px dashed var(--line); border-radius:16px; padding:28px 16px; text-align:center; color:var(--muted); background:#fbfeff;}
.tableWrap{overflow:auto; border:1px solid var(--line); border-radius:16px; background:#fff;}
table{width:100%; border-collapse:collapse; min-width:980px;}
th,td{padding:10px 12px; border-bottom:1px solid #eef3f7; text-align:left; vertical-align:top; font-size:13px;}
th{background:#f8fcff; position:sticky; top:0; z-index:1;}
tbody tr:hover{background:#fbfeff;}
.pagination{display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; margin-top:12px;}
.pageInfo{color:var(--muted); font-size:12px;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="headTop">
      <div>
        <h1 id="titleMain"></h1>
        <p class="sub" id="subMain"></p>
        <p class="note" id="loadNote"></p>
        <p class="note" id="formatNote"></p>
      </div>
      <button id="langBtn" class="langBtn" type="button"></button>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="controls">
        <div class="uploadBox">
          <div class="uploadRow">
            <input id="fileInput" type="file" multiple accept=".ris,.txt,.bib,.bibtex,text/plain,.ris,.txt,.bib,.bibtex">
            <button id="sampleBtn" type="button"></button>
          </div>
          <div class="uploadMeta" id="uploadHelp"></div>
        </div>

        <div class="noticeBox" id="noticeBox">
          <strong id="noticeTitle"></strong>
          <div id="noticeBody"></div>
        </div>

        <div class="search">
          <input id="q" type="text" />
          <button id="clearBtn" type="button"></button>
        </div>

        <div class="rangeBox">
          <div class="rangeLabel">
            <span id="yearLabel"></span>
            <span id="yearText">—</span>
          </div>
          <div class="rangeWrap">
            <div class="track"></div>
            <div class="fill" id="rangeFill"></div>
            <input id="yearMin" type="range" min="1900" max="2030" step="1" value="1900">
            <input id="yearMax" type="range" min="1900" max="2030" step="1" value="2030">
          </div>
        </div>

        <div id="filters"></div>
        <div class="selectedBox" id="selectedBox"></div>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="toolbarLeft">
          <div class="stats" id="stats">—</div>
        </div>
        <div class="toolbarRight">
          <select id="sortSelect"></select>
          <button id="viewBtn" type="button"></button>
          <button id="exportBtn" type="button"></button>
        </div>
      </div>

      <div id="cards" class="cards"></div>

      <div id="tableWrap" class="tableWrap hidden">
        <table>
          <thead>
            <tr>
              <th id="thTitle"></th>
              <th id="thAuthors"></th>
              <th id="thSource"></th>
              <th id="thYear"></th>
              <th id="thType"></th>
              <th id="thDOI"></th>
              <th id="thLink"></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="pagination">
        <button id="prevBtn" type="button"></button>
        <span class="pageInfo" id="pageInfo"></span>
        <button id="nextBtn" type="button"></button>
      </div>
    </main>
  </div>

  <div class="pageFooter" id="footerText"></div>
</div>

<script>
const FILTERS = ["docType","sourceTitle","language","wosCategory"];
const pageSize = 20;
let lang = localStorage.getItem("wd_science_lang") || "zh";
let viewMode = localStorage.getItem("wd_science_view") || "card";
let sortMode = localStorage.getItem("wd_science_sort") || "year_desc";
let rows = [];
let filtered = [];
let page = 1;
let minYear = 1900;
let maxYear = 2030;
const selections = new Map(FILTERS.map(k => [k, new Set()]));

const I18N = {
  zh: {
    pageTitle: "白海豚保育政策/科学文本数据库",
    sub: "上传并读取 Web of Science 文献计量文件，支持多文件合并、关键词检索、年份筛选、基础字段统计、表格/卡片视图与 CSV 导出。",
    formatNote: "建议优先使用 Web of Science 的 RIS 导出；本页也可直接读取文件名为 .txt 但内容为 RIS 标签的文件。",
    langBtn: "English",
    uploadHelp: "可一次上传多个 WOS 文件。推荐：RIS 导出；若下载文件名是 savedrecs.txt 但内容为 RIS 标签，也可直接读取。",
    sampleBtn: "加载示例数据",
    noticeTitle: "推荐格式",
    noticeBody: "首选 RIS。原因：字段结构稳定、通用性高、比 BibTeX 更少 LaTeX 清洗；若 WOS 下载为 .txt 但内容是 RIS 标签，也无需二次转换。",
    searchPlaceholder: "搜索标题、作者、期刊、摘要、关键词、DOI…",
    clear: "清空",
    yearRange: "年份范围",
    selectedNone: "当前未选择额外筛选条件。",
    searchChip: "关键词",
    stats: (shown, total) => `显示 ${shown} 条（共 ${total} 条）`,
    export: "导出当前结果 CSV",
    viewCard: "卡片视图",
    viewTable: "表格视图",
    prev: "上一页",
    next: "下一页",
    page: (p, total) => `第 ${p} / ${total} 页`,
    loadNote: (n, files, skipped) => `已载入 ${n} 条记录；来源文件 ${files} 个${skipped ? `；未识别 ${skipped} 个` : ""}`,
    empty: "暂无记录。请上传 WOS RIS 文件，或点击“加载示例数据”。",
    labels: {
      docType: "文献类型",
      sourceTitle: "来源期刊/载体",
      language: "语言",
      wosCategory: "WOS 分类"
    },
    sortOptions: {
      year_desc: "按年份（新→旧）",
      year_asc: "按年份（旧→新）",
      title_asc: "按标题（A→Z）",
      source_asc: "按来源（A→Z）",
      cited_desc: "按被引频次（高→低）"
    },
    card: {
      authors: "作者",
      source: "来源",
      docType: "文献类型",
      language: "语言",
      keywords: "关键词",
      doi: "DOI",
      cited: "被引频次",
      abstract: "摘要",
      link: "链接",
      open: "打开链接",
      noTitle: "（无标题）"
    },
    table: {
      title: "标题",
      authors: "作者",
      source: "来源",
      year: "年份",
      type: "类型",
      doi: "DOI",
      link: "链接"
    },
    footer: "本页为前端本地解析，不依赖 data.json；建议直接上传 WOS 的 RIS 导出文件。"
  },
  en: {
    pageTitle: "White Dolphin Policy/Science Text Database",
    sub: "Upload and read Web of Science bibliometric exports with multi-file merge, keyword search, year filtering, basic field analytics, card/table views, and CSV export.",
    formatNote: "Recommended: export from Web of Science in RIS format; this page can also read files named .txt when the content itself uses RIS tags.",
    langBtn: "中文",
    uploadHelp: "You can upload multiple WOS files at once. Recommended: RIS export. If the downloaded filename is savedrecs.txt but the content uses RIS tags, it can still be read directly.",
    sampleBtn: "Load sample data",
    noticeTitle: "Recommended format",
    noticeBody: "Prefer RIS. It has stable tagged fields, broad interoperability, and needs less cleanup than BibTeX; if WOS downloads it as .txt but the content is RIS-tagged, no conversion is needed.",
    searchPlaceholder: "Search title, authors, journal, abstract, keywords, DOI…",
    clear: "Clear",
    yearRange: "Year range",
    selectedNone: "No additional filters selected.",
    searchChip: "Keyword",
    stats: (shown, total) => `Showing ${shown} records (total ${total})`,
    export: "Export current results as CSV",
    viewCard: "Card view",
    viewTable: "Table view",
    prev: "Previous",
    next: "Next",
    page: (p, total) => `Page ${p} / ${total}`,
    loadNote: (n, files, skipped) => `Loaded ${n} records from ${files} file(s)${skipped ? `; skipped ${skipped}` : ""}`,
    empty: "No records yet. Upload WOS RIS files or click “Load sample data.”",
    labels: {
      docType: "Document type",
      sourceTitle: "Source title",
      language: "Language",
      wosCategory: "WOS category"
    },
    sortOptions: {
      year_desc: "Sort by year (new → old)",
      year_asc: "Sort by year (old → new)",
      title_asc: "Sort by title (A → Z)",
      source_asc: "Sort by source (A → Z)",
      cited_desc: "Sort by times cited (high → low)"
    },
    card: {
      authors: "Authors",
      source: "Source",
      docType: "Document type",
      language: "Language",
      keywords: "Keywords",
      doi: "DOI",
      cited: "Times cited",
      abstract: "Abstract",
      link: "Link",
      open: "Open link",
      noTitle: "(Untitled)"
    },
    table: {
      title: "Title",
      authors: "Authors",
      source: "Source",
      year: "Year",
      type: "Type",
      doi: "DOI",
      link: "Link"
    },
    footer: "This page parses files locally in the browser and does not depend on data.json; uploading WOS RIS exports is recommended."
  }
};

const el = {
  titleMain: document.getElementById('titleMain'),
  subMain: document.getElementById('subMain'),
  loadNote: document.getElementById('loadNote'),
  formatNote: document.getElementById('formatNote'),
  langBtn: document.getElementById('langBtn'),
  fileInput: document.getElementById('fileInput'),
  sampleBtn: document.getElementById('sampleBtn'),
  uploadHelp: document.getElementById('uploadHelp'),
  noticeTitle: document.getElementById('noticeTitle'),
  noticeBody: document.getElementById('noticeBody'),
  q: document.getElementById('q'),
  clearBtn: document.getElementById('clearBtn'),
  yearLabel: document.getElementById('yearLabel'),
  yearMin: document.getElementById('yearMin'),
  yearMax: document.getElementById('yearMax'),
  yearText: document.getElementById('yearText'),
  rangeFill: document.getElementById('rangeFill'),
  filters: document.getElementById('filters'),
  selectedBox: document.getElementById('selectedBox'),
  stats: document.getElementById('stats'),
  sortSelect: document.getElementById('sortSelect'),
  viewBtn: document.getElementById('viewBtn'),
  exportBtn: document.getElementById('exportBtn'),
  cards: document.getElementById('cards'),
  tableWrap: document.getElementById('tableWrap'),
  tableBody: document.getElementById('tableBody'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  pageInfo: document.getElementById('pageInfo'),
  thTitle: document.getElementById('thTitle'),
  thAuthors: document.getElementById('thAuthors'),
  thSource: document.getElementById('thSource'),
  thYear: document.getElementById('thYear'),
  thType: document.getElementById('thType'),
  thDOI: document.getElementById('thDOI'),
  thLink: document.getElementById('thLink'),
  footerText: document.getElementById('footerText')
};

function t(){ return I18N[lang]; }
function norm(v){ return v === null || v === undefined ? "" : String(v).trim(); }
function escapeHtml(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function parseYear(v){
  const s = norm(v);
  if(!s) return null;
  const m = s.match(/(19|20)\d{2}/);
  return m ? Number(m[0]) : null;
}
function unique(arr){ return Array.from(new Set(arr.filter(Boolean))); }

function renderTitleMain(){
  if(lang === "zh"){
    el.titleMain.innerHTML = `白海豚保育<a class="titleLink" href="./index.html">政策</a>/<a class="titleLink titleLinkScience" href="./science.html">科学</a>文本数据库`;
  }else{
    el.titleMain.innerHTML = `White Dolphin <a class="titleLink" href="./index.html">Policy</a>/<a class="titleLink titleLinkScience" href="./science.html">Science</a> Text Database`;
  }
}
function applyStaticTexts(){
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = t().pageTitle;
  renderTitleMain();
  el.subMain.textContent = t().sub;
  el.formatNote.textContent = t().formatNote;
  el.langBtn.textContent = t().langBtn;
  el.uploadHelp.textContent = t().uploadHelp;
  el.sampleBtn.textContent = t().sampleBtn;
  el.noticeTitle.textContent = t().noticeTitle;
  el.noticeBody.textContent = t().noticeBody;
  el.q.placeholder = t().searchPlaceholder;
  el.clearBtn.textContent = t().clear;
  el.yearLabel.textContent = t().yearRange;
  el.exportBtn.textContent = t().export;
  el.prevBtn.textContent = t().prev;
  el.nextBtn.textContent = t().next;
  el.viewBtn.textContent = viewMode === "card" ? t().viewTable : t().viewCard;
  el.thTitle.textContent = t().table.title;
  el.thAuthors.textContent = t().table.authors;
  el.thSource.textContent = t().table.source;
  el.thYear.textContent = t().table.year;
  el.thType.textContent = t().table.type;
  el.thDOI.textContent = t().table.doi;
  el.thLink.textContent = t().table.link;
  el.footerText.textContent = t().footer;
  populateSortSelect();
}
function populateSortSelect(){
  const current = sortMode;
  el.sortSelect.innerHTML = `
    <option value="year_desc">${t().sortOptions.year_desc}</option>
    <option value="year_asc">${t().sortOptions.year_asc}</option>
    <option value="title_asc">${t().sortOptions.title_asc}</option>
    <option value="source_asc">${t().sortOptions.source_asc}</option>
    <option value="cited_desc">${t().sortOptions.cited_desc}</option>
  `;
  el.sortSelect.value = current;
}
function buildFilterShell(){
  el.filters.innerHTML = FILTERS.map(key => `
    <section class="filterGroup" data-key="${key}">
      <h3>${escapeHtml(t().labels[key])}</h3>
      <div class="options" id="opts-${key}"></div>
    </section>
  `).join('');
}
function relabelFilterHeads(){
  el.filters.querySelectorAll('.filterGroup').forEach(group => {
    const key = group.dataset.key;
    const h3 = group.querySelector('h3');
    if(h3) h3.textContent = t().labels[key];
  });
}
function makeSafeId(key, value){
  return `${key}-${encodeURIComponent(value).replace(/[^a-zA-Z0-9_-]/g, "_")}`;
}
function getUniqueValues(key){
  return unique(rows.map(r => norm(r[key]))).sort((a,b) => a.localeCompare(b, lang === "zh" ? "zh-CN" : "en"));
}
function rowMatchesSearch(r){
  const q = norm(el.q.value).toLowerCase();
  if(!q) return true;
  const hay = [
    r.title, r.authorsText, r.sourceTitle, r.abstract, r.keywordsText, r.doi, r.language,
    r.docType, r.wosCategory, r.publisher, r.addressesText, r.wosId
  ].map(v => norm(v).toLowerCase()).join(" | ");
  return hay.includes(q);
}
function rowMatchesYear(r){
  const y = parseYear(r.year);
  if(y === null) return true;
  return y >= minYear && y <= maxYear;
}
function rowMatchesSelections(r){
  for(const key of FILTERS){
    const sel = selections.get(key);
    if(sel && sel.size && !sel.has(norm(r[key]) || "—")) return false;
  }
  return true;
}
function applyFilters(){
  filtered = rows.filter(r => rowMatchesSearch(r) && rowMatchesYear(r) && rowMatchesSelections(r));
  sortRows(filtered);
}
function sortRows(arr){
  arr.sort((a,b) => {
    if(sortMode === "year_desc") return (parseYear(b.year) ?? -Infinity) - (parseYear(a.year) ?? -Infinity);
    if(sortMode === "year_asc") return (parseYear(a.year) ?? Infinity) - (parseYear(b.year) ?? Infinity);
    if(sortMode === "title_asc") return norm(a.title).localeCompare(norm(b.title), lang === "zh" ? "zh-CN" : "en");
    if(sortMode === "source_asc") return norm(a.sourceTitle).localeCompare(norm(b.sourceTitle), lang === "zh" ? "zh-CN" : "en");
    if(sortMode === "cited_desc") return (Number(b.timesCited) || 0) - (Number(a.timesCited) || 0);
    return 0;
  });
}
function renderSelected(){
  const chips = [];
  for(const key of FILTERS){
    for(const v of Array.from(selections.get(key) || [])){
      chips.push(`<span class="selectedChip">${escapeHtml(t().labels[key])}: ${escapeHtml(v)}</span>`);
    }
  }
  const q = norm(el.q.value);
  if(q) chips.unshift(`<span class="selectedChip">${escapeHtml(t().searchChip)}: ${escapeHtml(q)}</span>`);
  el.selectedBox.innerHTML = chips.length ? chips.join("") : t().selectedNone;
}
function renderFilters(){
  relabelFilterHeads();
  for(const key of FILTERS){
    const container = document.getElementById(`opts-${key}`);
    if(!container) continue;
    const values = getUniqueValues(key).map(v => v || "—");
    const counts = new Map(values.map(v => [v, 0]));
    rows.forEach(r => {
      if(!rowMatchesSearch(r) || !rowMatchesYear(r)) return;
      let ok = true;
      for(const other of FILTERS){
        if(other === key) continue;
        const sel = selections.get(other);
        if(sel && sel.size && !sel.has(norm(r[other]) || "—")) { ok = false; break; }
      }
      if(!ok) return;
      const v = norm(r[key]) || "—";
      counts.set(v, (counts.get(v) || 0) + 1);
    });
    container.innerHTML = values.map(v => {
      const checked = selections.get(key).has(v);
      const count = counts.get(v) || 0;
      const disabled = count === 0 && !checked;
      const safeId = makeSafeId(key, v);
      return `
        <div class="option ${disabled ? 'disabled' : ''}">
          <input ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''} type="checkbox" id="${safeId}" data-key="${key}" data-val="${escapeHtml(v)}">
          <label for="${safeId}">
            <span>${escapeHtml(v)}</span>
            <span class="optionCount">${count}</span>
          </label>
        </div>`;
    }).join('');
    container.querySelectorAll('input[type="checkbox"]').forEach(box => {
      box.addEventListener('change', e => {
        const k = e.target.dataset.key;
        const v = e.target.dataset.val;
        if(e.target.checked) selections.get(k).add(v); else selections.get(k).delete(v);
        page = 1;
        renderAll();
      });
    });
  }
  renderSelected();
}
function getPageRows(){
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if(page > totalPages) page = totalPages;
  if(page < 1) page = 1;
  const start = (page - 1) * pageSize;
  return filtered.slice(start, start + pageSize);
}
function renderCards(){
  const pageRows = getPageRows();
  if(!filtered.length){
    el.cards.innerHTML = `<div class="empty">${escapeHtml(t().empty)}</div>`;
    return;
  }
  el.cards.innerHTML = pageRows.map(r => {
    const metaVals = unique([r.year, r.docType, r.sourceTitle, r.language, r.timesCited ? `${t().card.cited}: ${r.timesCited}` : ""]);
    const meta = metaVals.filter(Boolean).map(v => `<span class="pill">${escapeHtml(v)}</span>`).join("");
    return `
      <article class="card">
        <div class="title">${escapeHtml(r.title || t().card.noTitle)}</div>
        <div class="meta">${meta}</div>
        <div class="grid">
          <div class="field"><b>${escapeHtml(t().card.authors)}</b>${escapeHtml(r.authorsText || "—")}</div>
          <div class="field"><b>${escapeHtml(t().card.source)}</b>${escapeHtml(r.sourceTitle || "—")}</div>
          <div class="field"><b>${escapeHtml(t().card.docType)}</b>${escapeHtml(r.docType || "—")}</div>
          <div class="field"><b>${escapeHtml(t().card.language)}</b>${escapeHtml(r.language || "—")}</div>
          <div class="field"><b>${escapeHtml(t().card.keywords)}</b>${escapeHtml(r.keywordsText || "—")}</div>
          <div class="field"><b>${escapeHtml(t().card.doi)}</b>${escapeHtml(r.doi || "—")}</div>
          <div class="field"><b>${escapeHtml(t().card.link)}</b>${r.url ? `<a href="${escapeHtml(r.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(t().card.open)}</a>` : "—"}</div>
          <div class="field"><b>${escapeHtml(t().card.cited)}</b>${escapeHtml(String(r.timesCited || 0))}</div>
        </div>
        ${norm(r.abstract) ? `<div class="desc"><b style="color:var(--muted);font-weight:600">${escapeHtml(t().card.abstract)}：</b>${escapeHtml(r.abstract)}</div>` : ""}
      </article>
    `;
  }).join('');
}
function renderTable(){
  const pageRows = getPageRows();
  if(!filtered.length){
    el.tableBody.innerHTML = `<tr><td colspan="7">${escapeHtml(t().empty)}</td></tr>`;
    return;
  }
  el.tableBody.innerHTML = pageRows.map(r => `
    <tr>
      <td>${escapeHtml(r.title || t().card.noTitle)}</td>
      <td>${escapeHtml(r.authorsText || "—")}</td>
      <td>${escapeHtml(r.sourceTitle || "—")}</td>
      <td>${escapeHtml(r.year || "—")}</td>
      <td>${escapeHtml(r.docType || "—")}</td>
      <td>${escapeHtml(r.doi || "—")}</td>
      <td>${r.url ? `<a href="${escapeHtml(r.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(t().card.open)}</a>` : "—"}</td>
    </tr>
  `).join('');
}
function renderPagination(){
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  el.pageInfo.textContent = t().page(page, totalPages);
  el.prevBtn.disabled = page <= 1;
  el.nextBtn.disabled = page >= totalPages;
}
function updateRangeUI(){
  if(minYear > maxYear){ const tmp = minYear; minYear = maxYear; maxYear = tmp; }
  el.yearMin.value = minYear;
  el.yearMax.value = maxYear;
  el.yearText.textContent = `${minYear} — ${maxYear}`;
  const min = Number(el.yearMin.min), max = Number(el.yearMin.max);
  const left = ((minYear - min) / (max - min)) * 100;
  const right = ((maxYear - min) / (max - min)) * 100;
  el.rangeFill.style.left = `${left}%`;
  el.rangeFill.style.right = `${100 - right}%`;
}
function renderMainView(){
  el.stats.textContent = t().stats(filtered.length, rows.length);
  if(viewMode === "card"){
    el.cards.classList.remove("hidden");
    el.tableWrap.classList.add("hidden");
    renderCards();
  }else{
    el.cards.classList.add("hidden");
    el.tableWrap.classList.remove("hidden");
    renderTable();
  }
  renderPagination();
}
function renderAll(){
  applyStaticTexts();
  updateRangeUI();
  applyFilters();
  renderFilters();
  renderMainView();
}
function initYears(){
  const years = rows.map(r => parseYear(r.year)).filter(v => v !== null);
  minYear = years.length ? Math.min(...years) : 1900;
  maxYear = years.length ? Math.max(...years) : 2030;
  el.yearMin.min = el.yearMax.min = String(minYear);
  el.yearMin.max = el.yearMax.max = String(maxYear);
  el.yearMin.value = String(minYear);
  el.yearMax.value = String(maxYear);
}
function updateLoadNote(fileCount, skippedCount){
  el.loadNote.textContent = rows.length ? t().loadNote(rows.length, fileCount, skippedCount) : "";
}

function splitRisRecords(text){
  const cleaned = String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  const records = cleaned.split(/\nER\s{0,2}-.*?(?=\n|$)/g).map(s => s.trim()).filter(Boolean);
  if(records.length) return records;
  return cleaned.split(/\n\s*\n(?=TY\s{0,2}-)/g).map(s => s.trim()).filter(Boolean);
}
function detectRis(text){
  return /(^|\n)TY\s{0,2}-/m.test(text) && /(^|\n)ER\s{0,2}-/m.test(text);
}
function parseRisRecord(block){
  const lines = String(block || "").split("\n");
  const fields = {};
  let currentTag = "";
  for(const raw of lines){
    const line = raw.replace(/\uFEFF/g, "");
    const match = line.match(/^([A-Z0-9]{2})\s{0,2}-\s?(.*)$/);
    if(match){
      currentTag = match[1];
      if(!fields[currentTag]) fields[currentTag] = [];
      fields[currentTag].push(match[2] || "");
    }else if(currentTag && /^\s+/.test(line) && fields[currentTag]){
      fields[currentTag][fields[currentTag].length - 1] += " " + line.trim();
    }
  }
  const pick = (...tags) => {
    for(const tag of tags){
      const arr = fields[tag];
      if(arr && arr.length){
        const joined = arr.join("; ").trim();
        if(joined) return joined;
      }
    }
    return "";
  };
  const authors = unique([...(fields.AU || []), ...(fields.A1 || []), ...(fields.AF || [])]).map(s => s.trim()).filter(Boolean);
  const keywords = unique([...(fields.KW || []), ...(fields.DE || []), ...(fields.ID || [])]).map(s => s.trim()).filter(Boolean);
  const wosCategory = unique([...(fields.WC || []), ...(fields.SC || [])]).join("; ");
  const year = pick("PY", "Y1", "DA");
  const doi = pick("DO", "DI");
  const url = pick("UR", "L1", "L2", "LK");
  const sourceTitle = pick("JF", "JO", "T2", "JA", "J2");
  return {
    title: pick("TI", "T1", "CT"),
    authors,
    authorsText: authors.join("; "),
    sourceTitle,
    year,
    docType: pick("TY", "M3"),
    language: pick("LA"),
    abstract: pick("AB", "N2"),
    keywords,
    keywordsText: keywords.join("; "),
    doi,
    url,
    timesCited: Number((pick("TC") || "").match(/\d+/)?.[0] || 0),
    publisher: pick("PB"),
    addressesText: pick("C1", "AD"),
    wosCategory,
    wosId: pick("UT", "ID"),
    rawFields: fields
  };
}
function parseRisText(text){
  if(!detectRis(text)) return [];
  return splitRisRecords(text).map(parseRisRecord).filter(r => r.title || r.authorsText || r.sourceTitle);
}
function parseBibtexText(text){
  const chunks = String(text || "").split(/@(?=\w+\s*\{)/).map(s => s.trim()).filter(Boolean);
  if(!chunks.length) return [];
  return chunks.map(chunk => {
    const body = "@" + chunk;
    const grab = (name) => {
      const m = body.match(new RegExp(name + "\\s*=\\s*(\\{([^]*?)\\}|\"([^]*?)\")\\s*,?", "i"));
      return (m && (m[2] || m[3] || "")).replace(/\s+/g, " ").trim();
    };
    const authorsText = grab("author").replace(/\s+and\s+/gi, "; ");
    return {
      title: grab("title"),
      authors: authorsText ? authorsText.split(/\s*;\s*/).filter(Boolean) : [],
      authorsText,
      sourceTitle: grab("journal") || grab("booktitle"),
      year: grab("year"),
      docType: (body.match(/^@(\w+)/) || [,""])[1],
      language: "",
      abstract: grab("abstract"),
      keywords: grab("keywords") ? grab("keywords").split(/\s*[,;]\s*/).filter(Boolean) : [],
      keywordsText: grab("keywords"),
      doi: grab("doi"),
      url: grab("url"),
      timesCited: 0,
      publisher: grab("publisher"),
      addressesText: "",
      wosCategory: "",
      wosId: grab("wosid") || ""
    };
  }).filter(r => r.title || r.authorsText || r.sourceTitle);
}
async function loadFiles(fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  const all = [];
  let skipped = 0;
  for(const file of files){
    const text = await file.text();
    let parsed = [];
    if(detectRis(text)) parsed = parseRisText(text);
    else if(/\@\w+\s*\{/.test(text)) parsed = parseBibtexText(text);
    else skipped += 1;
    all.push(...parsed);
  }
  rows = dedupeRows(all);
  initYears();
  page = 1;
  updateLoadNote(files.length, skipped);
  renderAll();
}
function dedupeRows(arr){
  const seen = new Set();
  const out = [];
  for(const r of arr){
    const key = [norm(r.title).toLowerCase(), norm(r.year), norm(r.doi).toLowerCase(), norm(r.authorsText).toLowerCase()].join("||");
    if(seen.has(key)) continue;
    seen.add(key);
    r.docType = normalizeDocType(r.docType);
    out.push(r);
  }
  return out;
}
function normalizeDocType(v){
  const s = norm(v).toUpperCase();
  const map = {
    JOUR: "Journal Article",
    JOURNAL: "Journal Article",
    CONF: "Conference Paper",
    CPAPER: "Conference Paper",
    CHAP: "Book Chapter",
    BOOK: "Book",
    THES: "Thesis",
    RPRT: "Report"
  };
  return map[s] || norm(v);
}
function exportCsv(){
  const cols = ["title","authorsText","sourceTitle","year","docType","language","keywordsText","doi","timesCited","url","abstract","wosCategory","wosId"];
  const esc = v => {
    const s = norm(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = [cols.join(",")].concat(filtered.map(r => cols.map(c => esc(r[c])).join(","))).join("\n");
  const blob = new Blob(["\ufeff" + csv], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = lang === "zh" ? "science_filtered_results.csv" : "science_filtered_results.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
}

  rows = dedupeRows(parseRisText(sample));

function bindEvents(){
  el.fileInput.addEventListener('change', e => loadFiles(e.target.files));
  el.sampleBtn.addEventListener('click', loadSampleData);
  el.q.addEventListener('input', () => { page = 1; renderAll(); });
  el.clearBtn.addEventListener('click', () => {
    el.q.value = "";
    for(const key of FILTERS) selections.get(key).clear();
    if(rows.length){
      minYear = Number(el.yearMin.min);
      maxYear = Number(el.yearMax.max);
    }
    page = 1;
    renderAll();
  });
  el.yearMin.addEventListener('input', () => { minYear = Math.min(Number(el.yearMin.value), Number(el.yearMax.value)); page = 1; renderAll(); });
  el.yearMax.addEventListener('input', () => { maxYear = Math.max(Number(el.yearMax.value), Number(el.yearMin.value)); page = 1; renderAll(); });
  el.langBtn.addEventListener('click', () => {
    lang = lang === "zh" ? "en" : "zh";
    localStorage.setItem("wd_science_lang", lang);
    renderAll();
  });
  el.viewBtn.addEventListener('click', () => {
    viewMode = viewMode === "card" ? "table" : "card";
    localStorage.setItem("wd_science_view", viewMode);
    renderAll();
  });
  el.sortSelect.addEventListener('change', () => {
    sortMode = el.sortSelect.value;
    localStorage.setItem("wd_science_sort", sortMode);
    page = 1;
    renderAll();
  });
  el.exportBtn.addEventListener('click', exportCsv);
  el.prevBtn.addEventListener('click', () => { if(page > 1){ page--; renderMainView(); } });
  el.nextBtn.addEventListener('click', () => {
    const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
    if(page < totalPages){ page++; renderMainView(); }
  });
}

function main(){
  buildFilterShell();
  bindEvents();
  applyStaticTexts();
  renderAll();
}
main();
