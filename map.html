<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>中华白海豚保育政策地图</title>
<style>
:root{
  --bg:#f4fbff; --card:#ffffff; --line:#d7e5ef; --muted:#5b7285; --text:#10212f;
  --blue:#0ea5e9; --blue-2:#38bdf8; --blue-3:#7dd3fc; --blue-4:#dff4ff; --chip:#eef8ff;
  --shadow:0 10px 28px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--text);
  font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(14,165,233,.18), transparent 55%),
    radial-gradient(1000px 600px at 100% 0%, rgba(2,132,199,.10), transparent 50%),
    var(--bg);
  overflow-x:hidden;
  overflow-y:auto;
}
.wrap{max-width:1500px; margin:0 auto; padding:20px 16px 28px; min-height:100vh;}
.head,.sidebar,.main,.pageFooter{
  background:rgba(255,255,255,.88); border:1px solid var(--line); border-radius:18px;
  backdrop-filter: blur(8px); box-shadow:var(--shadow);
}
.head{padding:18px 18px 14px; margin-bottom:14px;}
.headTop{display:flex; justify-content:space-between; gap:12px; align-items:flex-start;}
h1{margin:0 0 6px; font-size:28px}
.sub{margin:0; color:var(--muted)}
.note{margin:8px 0 0; color:var(--muted); font-size:12px}
.layout{display:grid; grid-template-columns:320px 1fr; gap:14px; align-items:start; min-height:calc(100vh - 160px);}
@media (max-width: 980px){ .layout{grid-template-columns:1fr; min-height:auto;} .headTop{flex-direction:column;} body{overflow:auto;} .sidebar,.main{max-height:none; overflow:visible;} .pageFooter{margin-top:14px;} }
.sidebar,.main{min-height:0;}
.sidebar{padding:14px; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; overscroll-behavior:contain; scrollbar-gutter:stable;}
.main{padding:14px; max-height:calc(100vh - 24px); overflow:auto; overscroll-behavior:contain; scrollbar-gutter:stable;}
.pageFooter{padding:12px 14px; margin-top:14px; color:var(--muted); font-size:12px; text-align:center; display:flex; align-items:center; justify-content:center;}

.controls{display:grid; gap:12px;}
.search{display:flex; gap:8px; flex-wrap:wrap;}
input[type=text], button, select{
  border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--text);
  padding:10px 12px; font:inherit;
}
input[type=text]{flex:1; min-width:180px;}
button{cursor:pointer}
button:hover, select:hover{border-color:#b9d6e6; background:#fcfeff}
.langBtn{white-space:nowrap; font-weight:700;}

.rangeBox{border:1px solid var(--line); border-radius:14px; padding:12px; background:#fbfeff;}
.rangeLabel{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; color:var(--muted); font-size:12px;}
.rangeWrap{position:relative; height:34px; margin-top:2px;}
.track,.fill{position:absolute; left:0; right:0; top:50%; height:5px; transform:translateY(-50%); border-radius:999px;}
.track{background:#e4eef4}
.fill{background:linear-gradient(90deg, rgba(14,165,233,.25), rgba(14,165,233,.85));}
.rangeWrap input[type=range]{position:absolute; inset:0; width:100%; margin:0; appearance:none; background:none; pointer-events:none;}
.rangeWrap input::-webkit-slider-thumb{
  appearance:none; width:16px; height:16px; border-radius:50%; background:var(--blue);
  border:2px solid #fff; box-shadow:0 0 0 1px rgba(14,165,233,.35); pointer-events:auto;
}
.rangeWrap input::-moz-range-thumb{width:16px; height:16px; border:none; border-radius:50%; background:var(--blue); pointer-events:auto;}
.yearHist{position:relative; margin-top:10px; padding:8px 8px 6px; border-radius:12px; background:linear-gradient(180deg, rgba(248,252,255,.9), rgba(241,249,255,.72)); border:1px solid #e7f1f7;}
.yearBars{height:72px; display:grid; align-items:end; gap:0;}
.yearBar{position:relative; width:100%; min-height:2px; border-radius:0; background:linear-gradient(180deg, rgba(148,163,184,.42), rgba(148,163,184,.82)); transition:height .18s ease, opacity .18s ease, transform .18s ease, background .18s ease, box-shadow .18s ease;}
.yearBar:first-child{border-top-left-radius:4px;}
.yearBar:last-child{border-top-right-radius:4px;}
.yearBar.active{background:linear-gradient(180deg, rgba(125,211,252,.88), rgba(14,165,233,.98)); box-shadow:0 2px 8px rgba(14,165,233,.14);}
.yearBar.zero{min-height:1px; opacity:.35;}
.yearAxis{display:flex; justify-content:space-between; align-items:center; margin-top:6px; color:var(--muted); font-size:11px;}
.yearTooltip{position:absolute; left:0; top:0; z-index:8; min-width:98px; padding:8px 10px; border-radius:12px; background:rgba(16,33,47,.95); color:#fff; box-shadow:0 12px 28px rgba(15,23,42,.22); font-size:12px; line-height:1.25; pointer-events:none; opacity:0; transform:translate(-50%, -8px); transition:opacity .12s ease, transform .12s ease;}
.yearTooltip.show{opacity:1; transform:translate(-50%, -12px);}
.yearTooltipCount{margin-top:3px; color:rgba(255,255,255,.84);}
.yearFitOverlay{position:absolute; inset:8px 8px 24px 8px; width:calc(100% - 16px); height:64px; pointer-events:none; overflow:visible; z-index:2;}
.yearFitPath{fill:none; stroke:rgba(14,165,233,.95); stroke-width:0.75; vector-effect:non-scaling-stroke; stroke-linecap:round; stroke-linejoin:round;}
.yearFitLabel{position:absolute; left:10px; top:8px; z-index:3; max-width:min(78%, 360px); color:#0f2740; font-size:11px; line-height:1.28; pointer-events:none; background:none; border:none; box-shadow:none; padding:0;}
.yearFitLabel.hidden,.yearFitOverlay.hidden{display:none;}
.yearFitFormula{font-weight:700; letter-spacing:.1px;}
.yearFitR2{margin-top:1px; color:var(--muted);}

.filterGroup{border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-top:10px; background:#fbfeff;}
.filterHead{display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; border:none; background:#f8fcff; padding:10px 12px; cursor:pointer; font:inherit; font-weight:700;}
.filterHead small{color:var(--muted); font-weight:400}
.filterBody{padding:10px 12px; border-top:1px solid #edf4f8;}
.groupSearch{width:100%; margin-bottom:8px; padding:8px 10px; border-radius:10px;}
.options{display:grid; gap:6px; max-height:220px; overflow:auto; padding-right:4px;}
.option{display:flex; align-items:flex-start; gap:8px; padding:2px 0; font-size:13px;}
.option input{margin-top:2px}
.option label{display:flex; justify-content:space-between; gap:8px; width:100%; cursor:pointer;}
.optionCount{color:var(--muted); white-space:nowrap}
.option.disabled{opacity:.45}
.selectedBox{margin-top:10px; font-size:12px; color:var(--muted);}
.selectedChip{display:inline-block; margin:4px 6px 0 0; padding:4px 8px; border-radius:999px; background:var(--chip); color:#065f8f; border:1px solid #ccecff;}

.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:12px;}
.toolbarLeft,.toolbarRight{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.stats{color:var(--muted); font-size:13px;}
.pill{display:inline-block; padding:4px 8px; border-radius:999px; background:var(--chip); border:1px solid #d6efff; color:#065f8f; font-size:12px;}
.section{border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.9); box-shadow:0 6px 18px rgba(15,23,42,.04);}
.section + .section{margin-top:12px;}
.sectionHead{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:14px 16px 10px;}
.sectionTitle{margin:0; font-size:16px; font-weight:800;}
.sectionSub{margin:4px 0 0; font-size:12px; color:var(--muted);}

.countryTabsWrap{padding:0 14px 14px;}
.countryTabs{display:flex; flex-wrap:wrap; gap:10px;}
.countryTab{display:flex; align-items:center; gap:10px; min-width:0; padding:10px 12px; border:1px solid #d9ebf7; border-radius:14px; background:linear-gradient(180deg, rgba(249,253,255,.98), rgba(241,249,255,.95)); cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;}
.countryTab:hover{transform:translateY(-1px); border-color:#b8dcf1; box-shadow:0 8px 20px rgba(14,165,233,.10);}
.countryTab.active{border-color:rgba(14,165,233,.45); box-shadow:0 10px 24px rgba(14,165,233,.12); background:linear-gradient(180deg, rgba(235,248,255,.98), rgba(225,244,255,.98));}
.countryTabName{font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.countryTabCount{padding:4px 9px; border-radius:999px; font-weight:800; font-variant-numeric:tabular-nums; border:1px solid rgba(14,165,233,.16);}
.countryTabBar{width:8px; align-self:stretch; border-radius:999px; background:var(--blue-3);}
.tabActions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.infoText{font-size:12px; color:var(--muted);}
.mapSwitch{display:inline-flex; align-items:center; gap:6px; padding:4px; border:1px solid var(--line); border-radius:14px; background:#f8fcff;}
.mapSwitchBtn{padding:7px 12px; border-radius:10px; background:transparent; border:1px solid transparent; font-weight:700;}
.mapSwitchBtn.active{background:linear-gradient(180deg, rgba(235,248,255,.98), rgba(225,244,255,.98)); border-color:rgba(14,165,233,.28); color:#075985; box-shadow:0 6px 16px rgba(14,165,233,.10);}

.mapPanel{padding:0 14px 14px;}
.mapCanvasWrap{border:1px solid var(--line); border-radius:18px; background:linear-gradient(180deg, rgba(249,253,255,.98), rgba(240,248,255,.92)); min-height:560px; position:relative; overflow:hidden;}
#mapChart{width:100%; height:560px;}
.mapFallback{padding:18px;}
.mapFallbackGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px;}
.mapFallbackCard{border:1px solid #dbeaf4; border-radius:14px; background:#fff; padding:12px;}
.mapFallbackCard h4{margin:0 0 8px; font-size:14px;}
.legend{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:12px 0 0; color:var(--muted); font-size:12px;}
.legendScale{display:flex; gap:0; overflow:hidden; border-radius:999px; border:1px solid #d6e8f3;}
.legendScale span{display:block; width:34px; height:10px;}

.summaryGrid{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr); gap:12px; padding:0 14px 14px;}
@media (max-width: 1100px){ .summaryGrid{grid-template-columns:1fr;} }
.summaryCard{border:1px solid var(--line); border-radius:16px; background:#fff; padding:14px;}
.summaryCard h3{margin:0 0 10px; font-size:15px;}
.summaryList{display:grid; gap:10px;}
.summaryItem{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center;}
.summaryItemName{display:flex; gap:8px; align-items:center; min-width:0;}
.summaryDot{width:10px; height:10px; border-radius:50%; background:var(--blue-2); flex:0 0 10px;}
.summaryItemText{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;}
.summaryItemMeta{display:flex; align-items:center; gap:8px;}
.summaryBar{width:120px; height:8px; border-radius:999px; background:#e9f4fa; overflow:hidden;}
.summaryBarFill{height:100%; border-radius:999px; background:linear-gradient(90deg, rgba(125,211,252,.92), rgba(14,165,233,.98));}
.summaryCount{font-weight:800; color:#0b6c95; font-variant-numeric:tabular-nums; min-width:28px; text-align:right;}
.focusCard{min-height:100%;}
.focusEmpty{color:var(--muted); font-size:13px;}
.focusMeta{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.focusPager{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; flex-wrap:wrap;}
.focusPagerInfo{color:var(--muted); font-size:12px;}
.focusPagerActions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.focusPagerBtn{padding:6px 10px; border-radius:10px; background:#fff;}
.focusPagerBtn[disabled]{cursor:not-allowed; opacity:.45; background:#f6fafc;}
.focusList{margin-top:10px; display:grid; gap:8px; max-height:285px; overflow:auto; padding-right:4px;}
.focusItem{border:1px solid #e5eef5; border-radius:12px; padding:10px; background:#fbfeff;}
.focusItemTitle{font-weight:700; font-size:13px;}
.focusItemTitleLink{color:inherit; text-decoration:none; border-bottom:1px solid transparent;}
.focusItemTitleLink:hover{color:#075985; border-bottom-color:rgba(7,89,133,.28);}
.focusItemSub{margin-top:4px; color:var(--muted); font-size:12px;}

.loadingOverlay{position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; padding:24px; background:radial-gradient(900px 500px at 10% -10%, rgba(14,165,233,.18), transparent 55%), radial-gradient(1000px 600px at 100% 0%, rgba(2,132,199,.10), transparent 50%), rgba(244,251,255,.96); backdrop-filter: blur(10px); opacity:1; visibility:visible; transition:opacity .5s ease, visibility .5s ease;}
.loadingOverlay.hidden{opacity:0; visibility:hidden; pointer-events:none;}
.loadingPanel{width:min(520px,92vw); background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:22px; box-shadow:0 18px 48px rgba(15,23,42,.10); padding:26px 24px 22px;}
.loadingTitle{margin:0 0 8px; font-size:22px; font-weight:800;}
.loadingSub{margin:0 0 16px; color:var(--muted); font-size:14px; line-height:1.6;}
.loadingBar{position:relative; width:100%; height:12px; border-radius:999px; overflow:hidden; background:#e4eef4; border:1px solid #d7e5ef;}
.loadingBarFill{width:0%; height:100%; border-radius:999px; background:linear-gradient(90deg, rgba(125,211,252,.95), rgba(14,165,233,.98)); transition:width .35s ease;}
.loadingMeta{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:12px; color:var(--muted); font-size:13px;}
.loadingPercent{color:var(--text); font-weight:800; font-variant-numeric: tabular-nums;}
.empty{border:1px dashed var(--line); border-radius:16px; padding:28px 16px; text-align:center; color:var(--muted); background:#fbfeff;}
.hidden{display:none !important;}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
</head>

      <section class="section">

          <div class="tabActions">
            <div class="mapSwitch" role="tablist" aria-label="Map mode">
              <button id="mapModeWorldBtn" class="mapSwitchBtn" type="button"></button>

  <div class="pageFooter" id="footerText"></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js">

function __expandSpecialChinaCluster(rawText) {
  const t = String(rawText || '').toLowerCase();
  const out = [];
  const addMany = arr => arr.forEach(x => { if (!out.includes(x)) out.push(x); });

  if (t.includes('pearl river estuary') || t.includes('珠江口')) {
    addMany(['广州','深圳','珠海','中山','江门','东莞','惠州','香港','澳门']);
  }
  if (t.includes('beibu gulf') || t.includes('北部湾') || t.includes('北部灣')) {
    addMany(['湛江','茂名','阳江','北海','防城港','钦州','海口']);
  }
  if (t.includes('hong kong') || t.includes('香港')) addMany(['香港']);
  if (t.includes('macao') || t.includes('macao') || t.includes('澳门')) addMany(['澳门']);
  if (t.includes('taiwan') || t.includes('台湾') || t.includes('台灣')) addMany(['台湾']);
  return out;
}

    { bg:'rgba(169,225,251,.28)', text:'#1f5c79', border:'rgba(94,199,244,.28)', deep:'#a9e1fb' },

function getYearFitSeries(){
  const series = getYearCounts();
  if(!series.length) return { series, fit: null };
  const positiveYears = series.filter(d => d.count > 0).map(d => d.year);
  const latestYear = positiveYears.length ? Math.max(...positiveYears) : series[series.length - 1].year;
  const candidates = series.filter(d => d.year !== latestYear && d.count > 0);
  if(candidates.length < 2) return { series, fit: null };

  const x0 = candidates[0].year;
  const xs = candidates.map(d => d.year - x0);
  const ys = candidates.map(d => d.count);
  const lnYs = ys.map(Math.log);
  const n = xs.length;
  const sumX = xs.reduce((a,b)=>a+b,0);
  const sumY = lnYs.reduce((a,b)=>a+b,0);
  const sumXX = xs.reduce((a,b)=>a + b*b, 0);
  const sumXY = xs.reduce((a,b,i)=>a + b*lnYs[i], 0);
  const denom = n * sumXX - sumX * sumX;
  if(!Number.isFinite(denom) || Math.abs(denom) < 1e-12) return { series, fit: null };

  const b = (n * sumXY - sumX * sumY) / denom;
  const lnA = (sumY - b * sumX) / n;
  const a = Math.exp(lnA);
  if(!Number.isFinite(a) || !Number.isFinite(b)) return { series, fit: null };

  const predict = (year) => a * Math.exp(b * (year - x0));
  const yMean = ys.reduce((acc, val) => acc + val, 0) / ys.length;
  const ssRes = ys.reduce((acc, val, i) => {
    const diff = val - predict(candidates[i].year);
    return acc + diff * diff;
  }, 0);
  const ssTot = ys.reduce((acc, val) => {
    const diff = val - yMean;
    return acc + diff * diff;
  }, 0);
  const r2 = ssTot > 0 ? 1 - (ssRes / ssTot) : 1;

    fit: {

function normalizeOverlayGeometry(geometry){
  if(!geometry || !geometry.type || !geometry.coordinates) return [];
  if(geometry.type === 'Polygon') return Array.isArray(geometry.coordinates) ? [geometry.coordinates] : [];
  if(geometry.type === 'MultiPolygon') return Array.isArray(geometry.coordinates) ? geometry.coordinates : [];
  return [];
}
function getGeometryBounds(geometry){
  const polygons = normalizeOverlayGeometry(geometry);
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  polygons.forEach(poly => {
    const outer = Array.isArray(poly) && Array.isArray(poly[0]) ? poly[0] : [];
    outer.forEach(pt => {
      const x = Number(pt?.[0]);
      const y = Number(pt?.[1]);
      if(Number.isFinite(x) && Number.isFinite(y)){
        if(x < minX) minX = x;
        if(x > maxX) maxX = x;
        if(y < minY) minY = y;
        if(y > maxY) maxY = y;
      }
    });
  });
  if(!Number.isFinite(minX) || !Number.isFinite(minY) || !Number.isFinite(maxX) || !Number.isFinite(maxY)) return null;
  return { minX, minY, maxX, maxY, cx:(minX + maxX) / 2, cy:(minY + maxY) / 2 };
}

function computeFeatureWestBoundary(feature){
  const bounds = getGeometryBounds(feature?.geometry);
  return Number.isFinite(bounds?.minX) ? bounds.minX : null;
}
function updateFangchenggangWestBoundary(){
  const features = Array.isArray(chinaCityGeoJson?.features) ? chinaCityGeoJson.features : [];
  const feature = features.find(f => norm(f?.properties?.name) === '防城港市');
  fangchenggangWestBoundary = computeFeatureWestBoundary(feature);
  return fangchenggangWestBoundary;
}
function updateChinaCitySouthBoundary(){
  const features = Array.isArray(chinaCityGeoJson?.features) ? chinaCityGeoJson.features : [];
  let minY = Infinity;
  features.forEach(feature => {
    const bounds = getGeometryBounds(feature?.geometry);
    if(Number.isFinite(bounds?.minY) && bounds.minY < minY) minY = bounds.minY;
  });
  chinaCitySouthBoundary = Number.isFinite(minY) ? (minY - 1) : null;
  return chinaCitySouthBoundary;
}
function clampPolygonBoundaries(polygon, westBoundary, southBoundary){
  if(!Array.isArray(polygon) || (!Number.isFinite(westBoundary) && !Number.isFinite(southBoundary))) return polygon;
  return polygon.map(ring => {
    if(!Array.isArray(ring)) return ring;
    return ring.map(pt => {
      const x = Number(pt?.[0]);
      const y = Number(pt?.[1]);
      if(!Number.isFinite(x) || !Number.isFinite(y)) return pt;
      const nx = Number.isFinite(westBoundary) ? Math.max(x, westBoundary) : x;
      const ny = Number.isFinite(southBoundary) ? Math.max(y, southBoundary) : y;
      return [nx, ny];
    });
  });
}

function ensureSousaWorldCanvas(){
  const wrap = document.querySelector('.mapCanvasWrap');
  const host = el?.mapChart;
  if(!wrap || !host) return null;
  if(!sousaWorldCanvas){
    const canvas = document.createElement('canvas');
    canvas.id = 'sousaWorldOverlayCanvas';
    canvas.style.position = 'absolute';
    canvas.style.inset = '0';
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    canvas.style.pointerEvents = 'none';
    canvas.style.zIndex = '2';
    wrap.appendChild(canvas);
    sousaWorldCanvas = canvas;
    sousaWorldCanvasCtx = canvas.getContext('2d');
  }
  const dpr = Math.max(window.devicePixelRatio || 1, 1);
  const rect = host.getBoundingClientRect();
  const width = Math.max(1, Math.round(rect.width));
  const height = Math.max(1, Math.round(rect.height));
  if(sousaWorldCanvas.width != Math.round(width * dpr) || sousaWorldCanvas.height != Math.round(height * dpr)){
    sousaWorldCanvas.width = Math.round(width * dpr);
    sousaWorldCanvas.height = Math.round(height * dpr);
    sousaWorldCanvas.style.width = width + 'px';
    sousaWorldCanvas.style.height = height + 'px';
  }
  if(sousaWorldCanvasCtx){
    sousaWorldCanvasCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sousaWorldCanvasCtx.clearRect(0, 0, width, height);
  }
  return { canvas: sousaWorldCanvas, ctx: sousaWorldCanvasCtx, width, height };
}
function hideSousaWorldCanvas(){
  if(sousaWorldCanvasCtx && sousaWorldCanvas){
    const rect = sousaWorldCanvas.getBoundingClientRect();
    sousaWorldCanvasCtx.clearRect(0, 0, rect.width || 0, rect.height || 0);
  }
}
function drawSousaWorldOverlayCanvas(instance){
  if(!instance || mapMode !== 'world') { hideSousaWorldCanvas(); return; }
  const pack = ensureSousaWorldCanvas();
  if(!pack || !pack.ctx) return;
  const { ctx, width, height } = pack;
  const overlays = buildSousaOverlayEntries('world');
  ctx.clearRect(0, 0, width, height);

  const project = (pt) => {
    const p = instance.convertToPixel({ geoIndex: 0 }, pt);
    if(!Array.isArray(p) || !Number.isFinite(p[0]) || !Number.isFinite(p[1])) return null;
    return p;
  };
  const inFrame = (p) => p && p[0] >= -200 && p[0] <= width + 200 && p[1] >= -200 && p[1] <= height + 200;

  overlays.forEach((overlay) => {
    ctx.save();
    ctx.fillStyle = overlay.style.fill;
    ctx.strokeStyle = overlay.outline === false ? 'transparent' : overlay.style.stroke;
    ctx.lineWidth = overlay.outline === false ? 0 : 1.1;
    overlay.items.forEach((item) => {
      const coords = Array.isArray(item.coords) ? item.coords : [];
      const pts = coords.map(project).filter(Boolean);
      if(pts.length < 3) return;
      let visibleCount = 0;
      pts.forEach(p => { if(inFrame(p)) visibleCount += 1; });
      if(!visibleCount) return;
      ctx.beginPath();
      pts.forEach((p, idx) => {
        if(idx === 0) ctx.moveTo(p[0], p[1]);
        else ctx.lineTo(p[0], p[1]);
      });
      ctx.closePath();
      ctx.fill();
      if(overlay.outline !== false) ctx.stroke();
    });
    ctx.restore();

    const label = overlay.labels && overlay.labels[0];
    if(label){
      const p = project(label.value);
      if(inFrame(p)){
        const text = label.label || label.name || '';
        ctx.save();
        ctx.font = '700 12px sans-serif';
        const textW = Math.ceil(ctx.measureText(text).width);
        const boxW = Math.max(56, textW + 16);
        const boxH = 18;
        const x = p[0] + 6;
        const y = p[1] - 18;
        ctx.fillStyle = 'rgba(255,255,255,0.82)';
        ctx.strokeStyle = overlay.style.stroke;
        ctx.lineWidth = 0.5;
        const r = 6;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + boxW - r, y);
        ctx.quadraticCurveTo(x + boxW, y, x + boxW, y + r);
        ctx.lineTo(x + boxW, y + boxH - r);
        ctx.quadraticCurveTo(x + boxW, y + boxH, x + boxW - r, y + boxH);
        ctx.lineTo(x + r, y + boxH);
        ctx.quadraticCurveTo(x, y + boxH, x, y + boxH - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = overlay.style.stroke;
        ctx.textBaseline = 'middle';
        ctx.fillText(text, x + 8, y + boxH / 2 + 0.5);
        ctx.restore();
      }
    }
  });
}
function buildSousaOverlayEntries(mode){
  const speciesList = mode === 'city'
    ? ['Sousa chinensis']
    : ['Sousa chinensis', 'Sousa teuszii', 'Sousa plumbea', 'Sousa sahulensis'];
  const overlays = [];
  speciesList.forEach(species => {
    const geo = sousaOverlayGeoJsons[species];
    if(!geo || !Array.isArray(geo.features)) return;
    const style = SOUSA_OVERLAY_STYLES[species] || { fill:'rgba(148,163,184,0.16)', stroke:'rgba(100,116,139,0.72)' };
    const items = [];
    const labels = [];
    geo.features.forEach((feature, featureIndex) => {
      const polygons = normalizeOverlayGeometry(feature?.geometry);
      if(!polygons.length) return;
      const isChinaCityChinensis = mode === 'city' && species === 'Sousa chinensis';
      const westBoundary = isChinaCityChinensis
        ? (Number.isFinite(fangchenggangWestBoundary) ? fangchenggangWestBoundary : updateFangchenggangWestBoundary())
        : null;
      const southBoundary = isChinaCityChinensis
        ? (Number.isFinite(chinaCitySouthBoundary) ? chinaCitySouthBoundary : updateChinaCitySouthBoundary())
        : null;
      const adjustedPolygons = (Number.isFinite(westBoundary) || Number.isFinite(southBoundary))
        ? polygons.map(poly => clampPolygonBoundaries(poly, westBoundary, southBoundary))
        : polygons;
      const boundsSource = (Number.isFinite(westBoundary) || Number.isFinite(southBoundary))
        ? { type:'MultiPolygon', coordinates: adjustedPolygons }
        : feature.geometry;
      const bounds = getGeometryBounds(boundsSource);
      adjustedPolygons.forEach((poly, polyIndex) => {
        const outer = Array.isArray(poly) && Array.isArray(poly[0]) ? poly[0] : [];
        if(outer.length >= 3) items.push({ coords: outer, key: `${species}-${featureIndex}-${polyIndex}` });
      });
      if(bounds){
        labels.push({
          name: species,
          value: [bounds.cx, bounds.cy],
          label: species,
          itemStyle: { color: style.stroke }
        });
      }
    });
    if(items.length) overlays.push({ species, style, items, labels, outline: !(mode === 'city' && species === 'Sousa chinensis') });
  });
  return overlays;
}

function buildSousaOverlayGraphics(instance, mode){
  if(!instance || !window.echarts) return [];
  const overlays = buildSousaOverlayEntries(mode);
  const elements = [];
  overlays.forEach((overlay, overlayIdx) => {
    overlay.items.forEach((item, itemIdx) => {
      const points = (Array.isArray(item.coords) ? item.coords : [])
        .map(pt => instance.convertToPixel({ geoIndex: 0 }, pt))
        .filter(p => Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1]));
      if(points.length < 3) return;
      elements.push({
        id: `sousa-poly-${overlayIdx}-${itemIdx}`,
        type: 'polygon',
        silent: true,
        z: 90 + overlayIdx,
        shape: { points },
        style: {
          fill: overlay.style.fill,
          stroke: overlay.outline === false ? 'transparent' : overlay.style.stroke,
          lineWidth: overlay.outline === false ? 0 : 1.1
        }
      });
    });
    overlay.labels.forEach((labelItem, labelIdx) => {
      const pixel = instance.convertToPixel({ geoIndex: 0 }, labelItem.value);
      if(!Array.isArray(pixel) || !Number.isFinite(pixel[0]) || !Number.isFinite(pixel[1])) return;
      elements.push({
        id: `sousa-label-${overlayIdx}-${labelIdx}`,
        type: 'group',
        silent: true,
        z: 120 + overlayIdx,
        x: pixel[0] + 6,
        y: pixel[1] - 6,
        children: [
          {
            type: 'rect',
            shape: { x: -4, y: -12, width: Math.max(56, String(labelItem.label || '').length * 7.2), height: 18, r: 6 },
            style: { fill: 'rgba(255,255,255,0.82)', stroke: overlay.style.stroke, lineWidth: 0.5 }
          },
          {
            type: 'text',
            style: {
              x: 4,
              y: 1,
              text: labelItem.label || labelItem.name || '',
              fill: overlay.style.stroke,
              font: '700 12px sans-serif',
              textVerticalAlign: 'middle'
            }
          }
        ]
      });
    });
  });
  return elements;
}
function applySousaOverlayGraphics(instance, mode){
  if(!instance) return;
  hideSousaWorldCanvas();
  const elements = buildSousaOverlayGraphics(instance, mode);
  instance.setOption({ graphic: [{ id: 'sousa-overlay-root', type: 'group', silent: true, z: 90, children: elements }] });

async function loadSousaOverlayGeoJsons(){
  const loaded = {};
  for(const [species, path] of Object.entries(SOUSA_OVERLAY_FILES)){
    try{
      const res = await fetch(path, { cache:'no-store' });
      if(!res.ok) continue;
      const geo = await res.json();
      if(geo && (geo.type === 'FeatureCollection' || Array.isArray(geo.features))) loaded[species] = geo;
    }catch(err){}
  }
  sousaOverlayGeoJsons = loaded;
  return loaded;
}

function saveCurrentMapViewState(mode = mapMode){

  const option = chart.getOption();
  const geo = Array.isArray(option?.geo) ? option.geo[0] : option?.geo;
  const series = Array.isArray(option?.series) ? option.series[0] : null;
  const zoom = Number.isFinite(geo?.zoom) ? geo.zoom : (Number.isFinite(series?.zoom) ? series.zoom : mapViewState[mode]?.zoom);
  const center = Array.isArray(geo?.center) && geo.center.length === 2 ? geo.center : (Array.isArray(series?.center) && series.center.length === 2 ? series.center : null);
  mapViewState[mode] = { zoom, center };
}
function renderMap(){
  const groups = currentMapGroups();
  const scale = getCurrentAreaScale();
  const max = safeCount(scale.max);
  if(!groups.length){
    el.mapChart.classList.add('hidden');
    el.mapFallback.classList.remove('hidden');
    el.mapFallbackMessage.textContent = t().empty;
    el.mapFallbackGrid.innerHTML = '';
    return;
  }
  const isCityMode = mapMode === 'city';
  const activeGeo = isCityMode ? chinaCityGeoJson : mapGeoJson;
  const activeMapName = isCityMode ? 'wd_china_city_map' : 'wd_world_map';
  if(!activeGeo || !window.echarts){
    renderFallback(groups);
    return;
  }
  el.mapFallback.classList.add('hidden');
  el.mapChart.classList.remove('hidden');
  const instance = ensureChart();
  if(!instance){
    renderFallback(groups);
    return;
  }
  if(!echarts.getMap(activeMapName)) echarts.registerMap(activeMapName, activeGeo);
  const palette = scale.palette || getLogScale([]).palette;
  const breaks = Array.isArray(scale.breaks) ? scale.breaks.map(v => safeCount(v)) : [];
  const zeroColor = (scale.zeroColor && scale.zeroColor.deep) || '#d9dde3';
  const pieces = [{ lte: 0, color:zeroColor }];
  if(max > 0){
    pieces.push({ gt:0, lte:breaks[0] ?? max, color:palette[0].deep });
    pieces.push({ gt:breaks[0] ?? max, lte:breaks[1] ?? max, color:palette[1].deep });
    pieces.push({ gt:breaks[1] ?? max, lte:breaks[2] ?? max, color:palette[2].deep });
    pieces.push({ gt:breaks[2] ?? max, lte:breaks[3] ?? max, color:palette[3].deep });
    pieces.push({ gt:breaks[3] ?? max, color:palette[4].deep });
  }
  let data = [];
  if(isCityMode){
    const counts = getChinaCityCountMap();
    const groupsByKey = Object.fromEntries(chinaCityGroups().map(g => [g.key, g]));
    data = (Array.isArray(chinaCityGeoJson?.features) ? chinaCityGeoJson.features : []).map(feature => {
      const cityZh = norm(feature?.properties?.name);
      const group = groupsByKey[cityZh];
      return {
        name: cityZh,
        value: safeCount(counts[cityZh] || 0),
        dataTarget: cityZh,
        dataLabel: group ? group.name : cityZh
      };
    });
  }else{
    data = mapSeriesData().map(d => ({
      name: d.name,
      value: safeCount(d.value),
      dataTarget: d.dataTarget,
      dataAliases: Array.isArray(d.dataAliases) ? d.dataAliases : [],
      dataLabel: d.dataLabel,
      aliasLabel: d.aliasLabel || ''
    }));
  }
  const modeState = mapViewState[mapMode] || {};
  const preservedZoom = Number.isFinite(modeState.zoom) ? modeState.zoom : (isCityMode ? 1.15 : 1.05);
  const preservedCenter = Array.isArray(modeState.center) && modeState.center.length === 2 ? modeState.center : null;

  const option = {
    backgroundColor:'transparent',
    tooltip:{
      trigger:'item',
      formatter(params){
        const target = params?.data?.dataLabel || params?.data?.dataTarget || params?.name || '—';
        const aliasLabel = !isCityMode && params?.data?.aliasLabel ? ` (${params.data.aliasLabel})` : '';
        const value = safeCount(params?.data?.value);
        return `${escapeHtml(target)}${escapeHtml(aliasLabel)}<br>${escapeHtml(t().yearCount)}: ${value}`;
      }
    },
    visualMap:{ type:'piecewise', show:false, pieces },
    geo:{
      map:activeMapName,
      roam:true,
      zoom: preservedZoom,
      ...(preservedCenter ? { center: preservedCenter } : {}),
      emphasis:{ label:{ show:false }, itemStyle:{ areaColor:'#fdba74' } },
      itemStyle:{ borderColor:'#b9d5e6', borderWidth:isCityMode ? .6 : .9, areaColor:zeroColor },
      select:{ itemStyle:{ borderColor:'#333', borderWidth:2.2 }, label:{ show:false } }
    },
    series:[{
      name:'records',
      type:'map',
      map:activeMapName,
      geoIndex:0,
      selectedMode:'single',
      emphasis:{ label:{ show:false }, itemStyle:{ areaColor:'#fdba74' } },
      itemStyle:{ borderColor:'#b9d5e6', borderWidth:isCityMode ? .6 : .9, areaColor:zeroColor },
      select:{ itemStyle:{ borderColor:'#333', borderWidth:2.2 }, label:{ show:false } },
      data
    }, ...buildSousaOverlaySeries(mapMode)]
  };
  instance.setOption(option, true);
  applySousaOverlayGraphics(instance, mapMode);
  instance.off('georoam');
  instance.on('georoam', () => { saveCurrentMapViewState(mapMode); applySousaOverlayGraphics(instance, mapMode); });
  saveCurrentMapViewState(mapMode);
  instance.off('click');
  const zr = instance.getZr();
  if(zr && zr.__wdBlankClickHandler) zr.off('click', zr.__wdBlankClickHandler);
  instance.on('click', params => {
    saveCurrentMapViewState(mapMode);
    const target = norm(params?.data?.dataTarget || params?.name);
    if(!target) return;
    if(isCityMode){
      focusedCity = target;
      focusedCountry = '';
    }else{
      focusedCountry = target;
      focusedCity = '';
    }
    focusPage = 1;
    renderAll(false);
  });
  if(zr){
    zr.__wdBlankClickHandler = function(event){
      if(event && event.target) return;
      saveCurrentMapViewState(mapMode);
      if(isCityMode){
        if(!focusedCity) return;
        focusedCity = '';
      }else{
        if(!focusedCountry) return;
        focusedCountry = '';
      }
      focusPage = 1;
      renderAll(false);
    };
    zr.on('click', zr.__wdBlankClickHandler);
  }
  instance.dispatchAction({ type:'unselect', seriesIndex:0 });
  applySousaOverlayGraphics(instance, mapMode);
  if(isCityMode && focusedCity){
    const selectedName = data.find(d => d.dataTarget === focusedCity)?.name || null;
    if(selectedName) instance.dispatchAction({ type:'select', seriesIndex:0, name:selectedName });
  }
  if(!isCityMode && focusedCountry){
    const selectedName = data.find(d => Array.isArray(d.dataAliases) && d.dataAliases.includes(focusedCountry))?.name || null;
    if(selectedName) instance.dispatchAction({ type:'select', seriesIndex:0, name:selectedName });
  }
}

function exportCountryCsv(){
  const groups = countryGroups();
  const cols = ['country_or_region','count','year_min','year_max'];
  const esc = v => {
    const s = norm(v);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  const rowsCsv = groups.map(g => {
    const years = g.years;
    return [g.name, g.count, years.length ? Math.min(...years) : '', years.length ? Math.max(...years) : ''].map(esc).join(',');
  });
  const csv = [cols.join(',')].concat(rowsCsv).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = lang === 'zh' ? '国家地区统计.csv' : 'country_region_stats.csv';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}

function restoreSharedState(){
  const candidates = ['wd_visual_state', 'wd_map_state', 'wd_sankey_state'];
  for(const key of candidates){
    try{
      const raw = sessionStorage.getItem(key) || localStorage.getItem(key);
      if(!raw) continue;
      const state = JSON.parse(raw);
      if(state.lang === 'zh' || state.lang === 'en') lang = state.lang;
      if(typeof state.q === 'string') el.q.value = state.q;
      if(Number.isFinite(state.minYear)) minYear = state.minYear;
      if(Number.isFinite(state.maxYear)) maxYear = state.maxYear;
      if(state.filters && typeof state.filters === 'object'){
        FILTERS.forEach(k => {
          selections.get(k).clear();
          (state.filters[k] || []).forEach(v => selections.get(k).add(v));
        });
      }
      normalizeAllSelections();
      break;
    }catch(err){}
  }
}
function initYears(){
  const years = rows.map(r => parseYear(r.year)).filter(v => v !== null);
  minYear = years.length ? Math.max(minYear, Math.min(...years)) : 1900;
  maxYear = years.length ? Math.min(maxYear, Math.max(...years)) : 2030;
  if(minYear > maxYear){ minYear = years.length ? Math.min(...years) : 1900; maxYear = years.length ? Math.max(...years) : 2030; }
  el.yearMin.min = el.yearMax.min = String(years.length ? Math.min(...years) : 1900);
  el.yearMin.max = el.yearMax.max = String(years.length ? Math.max(...years) : 2030);
  el.yearMin.value = String(minYear);
  el.yearMax.value = String(maxYear);
}
let loadingValue = 0;
function updateLoading(progress, statusKey){
  loadingValue = Math.max(0, Math.min(100, Number(progress) || 0));
  if(el.loadingPercent) el.loadingPercent.textContent = `${loadingValue.toFixed(2)}%`;
  if(el.loadingBarFill) el.loadingBarFill.style.width = `${loadingValue}%`;
  if(el.loadingTitle) el.loadingTitle.textContent = `${t().loadingTitle} / ${t().loadingTitleEn}`;
  if(el.loadingSub) el.loadingSub.textContent = `${t().loadingSub} / ${t().loadingSubEn}`;
  if(el.loadingStatus && statusKey){
    const a = t()[statusKey] || '';
    const b = t()[`${statusKey}En`] || '';
    el.loadingStatus.textContent = b ? `${a} / ${b}` : a;
  }
}
function hideLoadingOverlay(){
  updateLoading(100, 'loadingDone');
  if(el.loadingOverlay) setTimeout(() => el.loadingOverlay.classList.add('hidden'), 120);
}
async function loadDataWithProgress(){
  const totalCandidates = Math.max(1, DATA_CANDIDATES.length);
  const startBase = 10, endBase = 72;
  const candidateSpan = (endBase - startBase) / totalCandidates;
  for(let i = 0; i < DATA_CANDIDATES.length; i++){
    const path = DATA_CANDIDATES[i];
    const baseStart = startBase + candidateSpan * i;
    const baseEnd = baseStart + candidateSpan;
    try{
      updateLoading(baseStart, 'loadingFetchingData');
      const res = await fetch(path, { cache:'no-store' });
      if(!res.ok) continue;
      const totalBytes = Number(res.headers.get('content-length') || 0);
      if(res.body && totalBytes > 0){
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let received = 0, text = '';
        while(true){
          const { done, value } = await reader.read();
          if(done) break;
          if(value){
            received += value.byteLength;
            text += decoder.decode(value, { stream:true });
            updateLoading(baseStart + candidateSpan * Math.min(1, received / totalBytes), 'loadingFetchingData');
          }
        }
        text += decoder.decode();
        updateLoading(baseEnd - 0.2, 'loadingParsingData');
        const data = JSON.parse(text);
        if(Array.isArray(data) && data.length){
          loadedPath = path;
          updateLoading(baseEnd, 'loadingParsingData');
          return data;
        }
      }else{
        const text = await res.text();
        updateLoading(baseStart + candidateSpan * .85, 'loadingParsingData');
        const data = JSON.parse(text);
        if(Array.isArray(data) && data.length){
          loadedPath = path;
          updateLoading(baseEnd, 'loadingParsingData');
          return data;
        }
      }
    }catch(err){}
  }
  throw new Error('No available data file');
}
async function loadReviewedGeoJson(){
  updateLoading(76, 'loadingFetchingMap');
  for(const path of MAP_GEO_CANDIDATES){
    try{
      const res = await fetch(path, { cache:'no-store' });
      if(!res.ok) continue;
      const geo = await res.json();
      if(geo && (geo.type === 'FeatureCollection' || geo.type === 'Topology' || Array.isArray(geo.features))){
        if(Array.isArray(geo.features)){
          geo.features.forEach(feature => {
            const props = feature.properties || (feature.properties = {});
            const rawCandidates = [props.name, props.name_en, props.admin, props.name_long, props.formal_en, props.sovereignt, props.geounit, props.subunit].map(norm).filter(Boolean);
            if(!norm(props.name)) props.name = rawCandidates[0] || '';
            const fallback = rawCandidates.map(name => GEO_FEATURE_FALLBACKS[name]).find(Boolean) || null;
            const aliasCandidates = [
              props.data_name,
              ...(Array.isArray(props.data_aliases) ? props.data_aliases : []),
              ...rawCandidates
            ];
            const normalizedAliases = normalizeAliasList(aliasCandidates);
            if(fallback){
              if(!norm(props.data_name)) props.data_name = fallback.data_name;
              if(!Array.isArray(props.data_aliases) || !props.data_aliases.length) props.data_aliases = fallback.data_aliases.slice();
              if(!norm(props.data_match_status)) props.data_match_status = fallback.data_match_status;
            }else if(normalizedAliases.length){
              if(!norm(props.data_name)) props.data_name = normalizedAliases[0];
              if(!Array.isArray(props.data_aliases) || !props.data_aliases.length) props.data_aliases = normalizedAliases.slice();
            }
          });
        }
        mapGeoJson = geo;
        mapGeoPath = path;
        updateLoading(84, 'loadingFetchingMap');
        return geo;
      }
    }catch(err){}
  }
  mapGeoJson = null;
  mapGeoPath = '';
  return null;
}
async function loadChinaCityGeoJson(){
  updateLoading(86, 'loadingFetchingMap');

  fangchenggangWestBoundary = null;
  chinaCitySouthBoundary = null;
  return null;
}
async function loadLatestGitHubCommitTime(){
  const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/commits/${GITHUB_BRANCH}`;
  try{
    const res = await fetch(url, { headers:{ 'Accept':'application/vnd.github+json' }, cache:'no-store' });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    latestCommitInfo = { date:data?.commit?.committer?.date || data?.commit?.author?.date || null, sha:data?.sha || '' };
  }catch(err){ latestCommitInfo = { error:true, message:String(err?.message || err) }; }
  updateFooter();
}
function renderAll(keepFocus = true){

  if(!keepFocus && focusedCountry && !countryGroups().some(g => g.name === focusedCountry)) focusedCountry = '';
  if(!keepFocus && focusedCity && !chinaCityGroups().some(g => g.key === focusedCity)) focusedCity = '';

  el.langBtn.addEventListener('click', () => { lang = lang === 'zh' ? 'en' : 'zh'; localStorage.setItem('wd_lang', lang); renderAll(); });
  el.sortSelect.addEventListener('change', () => { sortMode = el.sortSelect.value; localStorage.setItem('wd_map_sort', sortMode); renderAll(); });
  el.resetFocusBtn.addEventListener('click', () => { focusedCountry = ''; focusedCity = ''; focusPage = 1; renderAll(); });
  el.mapModeWorldBtn.addEventListener('click', () => { saveCurrentMapViewState(mapMode); mapMode = 'world'; localStorage.setItem('wd_map_mode', mapMode); focusedCity = ''; focusPage = 1; renderAll(false); });
  el.mapModeCityBtn.addEventListener('click', () => { saveCurrentMapViewState(mapMode); mapMode = 'city'; localStorage.setItem('wd_map_mode', mapMode); focusedCountry = ''; focusPage = 1; renderAll(false); });

main().catch(err => {
