<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>来源详情｜白海豚保育政策文本数据库</title>
<style>
:root{
  --bg:#f4fbff; --card:#ffffff; --line:#d7e5ef; --muted:#5b7285; --text:#10212f;
  --blue:#0ea5e9; --chip:#eef8ff;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--text);
  font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(14,165,233,.18), transparent 55%),
    radial-gradient(1000px 600px at 100% 0%, rgba(2,132,199,.10), transparent 50%),
    var(--bg);
  overflow-x:hidden;
}
.wrap{max-width:1450px; margin:0 auto; padding:20px 16px 28px; min-height:100vh;}
.head,.sidebar,.main,.pageFooter{background:rgba(255,255,255,.88); border:1px solid var(--line); border-radius:18px; backdrop-filter: blur(8px); box-shadow:0 10px 28px rgba(15,23,42,.05);}
.head{padding:18px 18px 14px; margin-bottom:14px;}
.headTop{display:flex; justify-content:space-between; gap:12px; align-items:flex-start;}
h1{margin:0 0 6px; font-size:28px}
.sub{margin:0; color:var(--muted)}
.note{margin:8px 0 0; color:var(--muted); font-size:12px}
.layout{display:grid; grid-template-columns:320px 1fr; gap:14px; align-items:start; min-height:calc(100vh - 160px);}
@media (max-width: 960px){ .layout{grid-template-columns:1fr; min-height:auto;} .headTop{flex-direction:column;} body{overflow:auto;} .sidebar,.main{max-height:none; overflow:visible;} .pageFooter{margin-top:14px;}}
.sidebar,.main{min-height:0;}
.sidebar{padding:14px; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto;}
.main{padding:14px; max-height:calc(100vh - 24px); overflow-y:auto;}
.controls{display:grid; gap:12px;}
.search{display:flex; gap:8px; flex-wrap:wrap;}
input[type=text], button, select{border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--text); padding:10px 12px; font:inherit;}
input[type=text]{flex:1; min-width:180px;}
button{cursor:pointer}
button:hover, select:hover{border-color:#b9d6e6; background:#fcfeff}
.filterGroup{border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-top:10px; background:#fbfeff;}
.filterHead{display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; border:none; background:#f8fcff; padding:10px 12px; cursor:pointer; font:inherit; font-weight:700;}
.filterHead small{color:var(--muted); font-weight:400}
.filterBody{padding:10px 12px; border-top:1px solid #edf4f8;}
.groupSearch{width:100%; margin-bottom:8px; padding:8px 10px; border-radius:10px;}
.options{display:grid; gap:6px; max-height:220px; overflow:auto; padding-right:4px;}
.option{display:flex; align-items:flex-start; gap:8px; padding:2px 0; font-size:13px;}
.option input{margin-top:2px}
.option label{display:flex; justify-content:space-between; gap:8px; width:100%; cursor:pointer;}
.optionCount{color:var(--muted); white-space:nowrap}
.option.disabled{opacity:.45}
.selectedBox{margin-top:10px; font-size:12px; color:var(--muted);}
.selectedChip{display:inline-block; margin:4px 6px 0 0; padding:4px 8px; border-radius:999px; background:var(--chip); color:#065f8f; border:1px solid #ccecff;}
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:12px;}
.toolbarLeft,.toolbarRight{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.stats{color:var(--muted); font-size:13px;}
.pill{display:inline-block; padding:4px 8px; border-radius:999px; background:var(--chip); border:1px solid #d6efff; color:#065f8f; font-size:12px; margin-right:6px}
.cards{display:grid; gap:10px;}
.card{border:1px solid var(--line); border-radius:16px; background:var(--card); padding:14px; box-shadow:0 6px 18px rgba(15,23,42,.04);}
.title{font-size:16px; font-weight:800; margin:0 0 8px;}
.meta{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 14px; margin-top:10px;}
@media (max-width: 900px){ .grid{grid-template-columns:1fr;} }
.field{font-size:13px;}
.field b{display:inline-block; min-width:120px; color:var(--muted); font-weight:600}
a{color:#0284c7; text-decoration:none}
a:hover{text-decoration:underline}
.desc{color:#31475a; margin:8px 0 0; font-size:13px}
.empty{border:1px dashed var(--line); border-radius:16px; padding:28px 16px; text-align:center; color:var(--muted); background:#fbfeff;}
.tableWrap{overflow:auto; border:1px solid var(--line); border-radius:16px; background:#fff;}
table{width:100%; border-collapse:collapse; min-width:1080px;}
th,td{padding:10px 12px; border-bottom:1px solid #eef3f7; text-align:left; vertical-align:top; font-size:13px;}
th{background:#f8fcff; position:sticky; top:0; z-index:1;}
tbody tr:hover{background:#fbfeff;}
.pagination{display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; margin-top:12px;}
.pageInfo{color:var(--muted); font-size:12px;}
.hidden{display:none;}
.pageFooter{padding:12px 14px; margin-top:14px; color:var(--muted); font-size:12px; text-align:center;}

.loadingOverlay{
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(14,165,233,.18), transparent 55%),
    radial-gradient(1000px 600px at 100% 0%, rgba(2,132,199,.10), transparent 50%),
    rgba(244,251,255,.96);
  backdrop-filter: blur(10px);
  opacity:1; visibility:visible;
  transition:opacity .5s ease, visibility .5s ease;
}
.loadingOverlay.hidden{
  opacity:0; visibility:hidden; pointer-events:none;
}
.loadingPanel{
  width:min(520px, 92vw);
  background:rgba(255,255,255,.92);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 18px 48px rgba(15,23,42,.10);
  padding:26px 24px 22px;
}
.loadingTitle{
  margin:0 0 8px;
  font-size:22px;
  font-weight:800;
}
.loadingSub{
  margin:0 0 16px;
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
}
.loadingBar{
  position:relative;
  width:100%;
  height:12px;
  border-radius:999px;
  overflow:hidden;
  background:#e4eef4;
  border:1px solid #d7e5ef;
}
.loadingBarFill{
  width:0%;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg, rgba(125,211,252,.95), rgba(14,165,233,.98));
  transition:width .35s ease;
}
.loadingMeta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
}
.loadingPercent{
  color:var(--text);
  font-weight:800;
  font-variant-numeric: tabular-nums;
}

</style>
</head>
<body>

<div class="loadingOverlay" id="loadingOverlay" aria-live="polite">
  <div class="loadingPanel">
    <h2 class="loadingTitle" id="loadingTitle">正在加载 / Loading</h2>
    <p class="loadingSub" id="loadingSub">正在读取页面与数据，请稍候… / Loading page and data, please wait…</p>
    <div class="loadingBar" aria-hidden="true">
      <div class="loadingBarFill" id="loadingBarFill"></div>
    </div>
    <div class="loadingMeta">
      <span id="loadingStatus">准备中 / Preparing…</span>
      <span class="loadingPercent" id="loadingPercent">0%</span>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="head">
    <div class="headTop">
      <div>
        <h1 id="titleMain"></h1>
        <p class="sub" id="subMain"></p>
        <p class="note" id="loadNote"></p>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">

    <aside class="sidebar">

          <button id="clearBtn" type="button"></button>
        </div>
        <div id="filters"></div>
        <div class="selectedBox" id="selectedBox"></div>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="toolbarLeft"><div class="stats" id="stats"></div></div>
        <div class="toolbarRight">
          <select id="sortSelect"></select>
          <button id="viewBtn" type="button"></button>
          <button id="exportBtn" type="button"></button>
        </div>
      </div>

      <div id="cards" class="cards"></div>
      <div id="tableWrap" class="tableWrap hidden">
        <table>
          <thead>
            <tr>
              <th id="thTitle"></th>
              <th id="thRegion"></th>
              <th id="thYear"></th>
              <th id="thDocType"></th>
              <th id="thLevel"></th>
              <th id="thTargeting"></th>
              <th id="thSource"></th>

          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="pagination">
        <button id="prevBtn" type="button"></button>
        <span class="pageInfo" id="pageInfo"></span>
        <button id="nextBtn" type="button"></button>
      </div>
    </main>
  </div>

  <div class="pageFooter" id="footerText"></div>
</div>

<script>
const DATA_CANDIDATES = [
  './data_with_source.json',
  './data_expanded_226_mainland_boost.json',
  './data_expanded_221_mainland_boost.json',
  './data_expanded_217_mainland_boost.json',
  './data_expanded_212_mainland_boost.json',

const FILTERS = ['jurisdiction','country_or_region','subnational_area','document_type','hierarchy_level','targeting_category','language','taxon_label_used_in_text'];

const pageSize = 20;
const I18N = {
  zh: {

    card: { document_type:'文本类型', hierarchy_level:'层级', targeting_category:'针对性', function_type:'功能类型', taxon_label_used_in_text:'分类名', source_url:'链接', source:'来源', notes:'备注：', open:'打开原文', noTitle:'（无标题）' },
    table: { title:'标题', region:'地区', year:'年份', document_type:'文本类型', level:'层级', targeting:'针对性', source:'来源链接' },
    targetingMap: { A:'A｜直接针对白海豚', B:'B｜明确提及白海豚/栖息地', C:'C｜上位法（适用于白海豚）' },
    noMatchOption:'无匹配选项', filterSearchPlaceholder:'筛选本组选项', toggle:'展开/收起'
  },
  en: {

    loadingPreparing: 'Preparing…',
    loadingPreparingEn: '准备中',
    loadingFetchingData: 'Reading data file',
    loadingFetchingDataEn: '正在读取数据文件',
    loadingRendering: 'Rendering content',
    loadingRenderingEn: '正在渲染内容',
    loadingDone: 'Completed',
    loadingDoneEn: '加载完成',
    sub: source => `Current source: ${source}`,
    searchPlaceholder: 'Search title, region, functions, category, notes…',
    clear: 'Clear',
    langBtn: '中文',
    back: 'Back to source directory',
    loaded: (n, p) => `Loaded ${n} records. Source: ${p}`,
    stats: (shown, total) => `Showing ${shown} records (${total} total for this source)`,
    selectedNone: 'No additional filters selected.',
    searchChip: 'Keyword',
    noSourceParam: 'Missing source parameter. Please open this page from the source directory.',
    noMatch: 'No matching records under this source.',
    viewCard: 'Card view',
    viewTable: 'Table view',
    prev: 'Previous', next: 'Next',
    page: (p, t) => `Page ${p} / ${t}`,
    export: 'Export current results as CSV',
    footerLoading: 'Latest update time (Beijing Time / UTC): loading…',
    footerError: 'Latest update time (Beijing Time / UTC): failed to load',
    footerTemplate: (cn, en) => `最新更新时间（北京时间 / UTC）：${cn} ｜ Latest update time (Beijing Time / UTC): ${en}`,
    labels: { jurisdiction:'Jurisdiction', country_or_region:'Country / Region', subnational_area:'Subnational area', document_type:'Document type', hierarchy_level:'Legal / institutional level', targeting_category:'Targeting category', language:'Language', taxon_label_used_in_text:'Taxon label used in text' },
    sortOptions: { year_desc:'Sort by year (new → old)', year_asc:'Sort by year (old → new)', title_asc:'Sort by title (A → Z)', title_desc:'Sort by title (Z → A)', region_asc:'Sort by region (A → Z)' },
    card: { document_type:'Document type', hierarchy_level:'Level', targeting_category:'Targeting', function_type:'Function type', taxon_label_used_in_text:'Taxon label', source_url:'Link', source:'Source', notes:'Notes:', open:'Open source', noTitle:'(Untitled)' },
    table: { title:'Title', region:'Region', year:'Year', document_type:'Document type', level:'Level', targeting:'Targeting', source:'Source link' },

    noMatchOption:'No matching options', filterSearchPlaceholder:'Filter options in this group', toggle:'Expand / collapse'
  }
};
let lang = localStorage.getItem('wd_lang') || 'zh';
let allRows = [];
let rows = [];
let filtered = [];
let page = 1;
let sortMode = localStorage.getItem('wd_sort') || 'year_desc';
let viewMode = localStorage.getItem('wd_view') || 'card';
let loadedPath = '';
let latestCommitInfo = null;
const selections = new Map(FILTERS.map(k => [k, new Set()]));
const sourceName = new URLSearchParams(window.location.search).get('source') || '';
const urlLang = new URLSearchParams(window.location.search).get('lang');
if(urlLang === 'zh' || urlLang === 'en') lang = urlLang;
const el = {
  titleMain: document.getElementById('titleMain'), subMain: document.getElementById('subMain'), loadNote: document.getElementById('loadNote'), langBtn: document.getElementById('langBtn'), backBtn: document.getElementById('backBtn'), backLink: document.getElementById('backLink'), q: document.getElementById('q'), clearBtn: document.getElementById('clearBtn'), filters: document.getElementById('filters'), selectedBox: document.getElementById('selectedBox'), stats: document.getElementById('stats'), cards: document.getElementById('cards'), tableWrap: document.getElementById('tableWrap'), tableBody: document.getElementById('tableBody'), sortSelect: document.getElementById('sortSelect'), viewBtn: document.getElementById('viewBtn'), exportBtn: document.getElementById('exportBtn'), footerText: document.getElementById('footerText'), prevBtn: document.getElementById('prevBtn'), nextBtn: document.getElementById('nextBtn'), pageInfo: document.getElementById('pageInfo'), thTitle: document.getElementById('thTitle'), thRegion: document.getElementById('thRegion'), thYear: document.getElementById('thYear'), thDocType: document.getElementById('thDocType'), thLevel: document.getElementById('thLevel'), thTargeting: document.getElementById('thTargeting'), thSource: document.getElementById('thSource'), loadingOverlay: document.getElementById('loadingOverlay'), loadingTitle: document.getElementById('loadingTitle'), loadingSub: document.getElementById('loadingSub'), loadingStatus: document.getElementById('loadingStatus'), loadingPercent: document.getElementById('loadingPercent'), loadingBarFill: document.getElementById('loadingBarFill')
};
function t(){ return I18N[lang]; }

function applyLoadingTexts(){
  if(el.loadingTitle) el.loadingTitle.textContent = `${t().loadingTitle} / ${t().loadingTitleEn}`;
  if(el.loadingSub) el.loadingSub.textContent = `${t().loadingSub} / ${t().loadingSubEn}`;
}
function setLoadingProgress(percent, statusZh, statusEn){
  const p = Math.max(0, Math.min(100, Number(percent) || 0));
  if(el.loadingBarFill) el.loadingBarFill.style.width = `${p}%`;
  if(el.loadingPercent) el.loadingPercent.textContent = `${Math.round(p)}%`;
  if(el.loadingStatus) el.loadingStatus.textContent = `${statusZh} / ${statusEn}`;
}
function hideLoadingOverlay(){
  setLoadingProgress(100, t().loadingDone, t().loadingDoneEn);
  if(el.loadingOverlay){
    setTimeout(() => el.loadingOverlay.classList.add('hidden'), 120);
  }
}

function norm(v){ return v === null || v === undefined ? '' : String(v).trim(); }
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function parseYear(v){ const n = Number(String(v ?? '').trim()); return Number.isFinite(n) ? n : null; }
function maybeTranslate(value){ const v = norm(value); if(lang === 'zh') return v; return VALUE_MAP_EN[v] || v; }
function displayTargeting(v){ const key = norm(v); return t().targetingMap[key] || maybeTranslate(key) || '—'; }
function getComparableValue(r, key){ let v = norm(r[key]) || '（空）'; if(key === 'targeting_category') return displayTargeting(v); return maybeTranslate(v); }
function compareText(a,b){ return String(a).localeCompare(String(b), lang === 'zh' ? 'zh-CN' : 'en', { sensitivity:'base' }); }
function formatGitHubTimestamp(dateString, locale){ if(!dateString) return '—'; const d = new Date(dateString); if(Number.isNaN(d.getTime())) return '—'; const zone = locale === 'zh' ? 'Asia/Shanghai' : 'UTC'; const label = locale === 'zh' ? 'UTC+08:00' : 'UTC'; const formatter = new Intl.DateTimeFormat(locale === 'zh' ? 'zh-CN' : 'en-GB', { timeZone: zone, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }); return `${formatter.format(d)} (${label})`; }
function footerHtml(){ if(!latestCommitInfo) return escapeHtml(t().footerLoading); if(latestCommitInfo.error) return escapeHtml(t().footerError); const cn = formatGitHubTimestamp(latestCommitInfo.date, 'zh'); const en = formatGitHubTimestamp(latestCommitInfo.date, 'en'); return escapeHtml(t().footerTemplate(cn, en)); }
async function loadLatestGitHubCommitTime(){ const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/commits/${GITHUB_BRANCH}`; try{ const res = await fetch(url, { headers: { 'Accept':'application/vnd.github+json' }, cache:'no-store' }); if(!res.ok) throw new Error(`HTTP ${res.status}`); const data = await res.json(); latestCommitInfo = { date: data?.commit?.committer?.date || data?.commit?.author?.date || null }; }catch(err){ latestCommitInfo = { error:true, message:String(err?.message || err) }; } el.footerText.innerHTML = footerHtml(); }
async function loadRows(){ for(const path of DATA_CANDIDATES){ try{ const res = await fetch(path, { cache:'no-store' }); if(!res.ok) continue; const data = await res.json(); if(Array.isArray(data) && data.length){ loadedPath = path; return data; } }catch(err){} } throw new Error('No available data file'); }
function populateSortSelect(){ el.sortSelect.innerHTML = `<option value="year_desc">${t().sortOptions.year_desc}</option><option value="year_asc">${t().sortOptions.year_asc}</option><option value="title_asc">${t().sortOptions.title_asc}</option><option value="title_desc">${t().sortOptions.title_desc}</option><option value="region_asc">${t().sortOptions.region_asc}</option>`; el.sortSelect.value = sortMode; }
function buildFilterShell(){ el.filters.innerHTML = FILTERS.map((key) => `<section class="filterGroup" data-key="${key}"><button class="filterHead" type="button"><span></span><small></small></button><div class="filterBody"><input class="groupSearch" data-group-search="${key}" type="text"><div class="options" id="opts-${key}"></div></div></section>`).join(''); el.filters.querySelectorAll('.filterHead').forEach(btn => btn.addEventListener('click', () => { const body = btn.parentElement.querySelector('.filterBody'); body.style.display = body.style.display === 'none' ? '' : 'none'; })); el.filters.querySelectorAll('.groupSearch').forEach(inp => inp.addEventListener('input', () => { page = 1; renderFilters(); renderAll(); })); }
function relabelFilterHeads(){ el.filters.querySelectorAll('.filterGroup').forEach(group => { const key = group.dataset.key; group.querySelector('.filterHead span').textContent = t().labels[key]; group.querySelector('.filterHead small').textContent = t().toggle; group.querySelector('.groupSearch').placeholder = t().filterSearchPlaceholder; }); }
function rowMatchesSearch(r){ const q = norm(el.q.value).toLowerCase(); if(!q) return true; const pool = [r.document_title, r.country_or_region, r.subnational_area, r.document_type, r.hierarchy_level, r.targeting_category, displayTargeting(r.targeting_category), r.function_type, r.taxon_label_used_in_text, r.notes, r.source_url, r.language, r.jurisdiction, r.source].map(v => norm(v).toLowerCase()).join(' | '); return pool.includes(q); }
function rowMatchesSelections(r, ignoreKey=null){ for(const key of FILTERS){ if(key === ignoreKey) continue; const sel = selections.get(key); if(!sel || sel.size === 0) continue; const val = getComparableValue(r, key); if(!sel.has(val)) return false; } return true; }
function getUniqueValues(key){ const set = new Set(); rows.forEach(r => set.add(getComparableValue(r, key))); return Array.from(set).sort((a,b)=>compareText(a,b)); }
function sortRows(arr){ arr.sort((a,b) => { if(sortMode === 'year_desc') return (parseYear(b.year) ?? -Infinity) - (parseYear(a.year) ?? -Infinity); if(sortMode === 'year_asc') return (parseYear(a.year) ?? Infinity) - (parseYear(b.year) ?? Infinity); if(sortMode === 'title_asc') return compareText(norm(a.document_title), norm(b.document_title)); if(sortMode === 'title_desc') return compareText(norm(b.document_title), norm(a.document_title)); if(sortMode === 'region_asc'){ const ra = (maybeTranslate(a.country_or_region) + ' ' + maybeTranslate(a.subnational_area)).trim(); const rb = (maybeTranslate(b.country_or_region) + ' ' + maybeTranslate(b.subnational_area)).trim(); return compareText(ra, rb); } return 0; }); }
function applyFilters(){ filtered = rows.filter(r => rowMatchesSearch(r) && rowMatchesSelections(r)); sortRows(filtered); }
function renderSelected(){ const chips = []; for(const key of FILTERS){ const vals = Array.from(selections.get(key) || []); vals.forEach(v => chips.push(`<span class="selectedChip">${escapeHtml(t().labels[key])}: ${escapeHtml(v)}</span>`)); } const q = norm(el.q.value); if(q) chips.unshift(`<span class="selectedChip">${escapeHtml(t().searchChip)}: ${escapeHtml(q)}</span>`); el.selectedBox.innerHTML = chips.length ? chips.join('') : t().selectedNone; }
function makeSafeId(key, value){ const raw = encodeURIComponent(value); return `${key}-${raw.replace(/[^a-zA-Z0-9_-]/g, '_')}`; }
function renderFilters(){ relabelFilterHeads(); for(const key of FILTERS){ const container = document.getElementById(`opts-${key}`); const searchText = norm(el.filters.querySelector(`[data-group-search="${key}"]`)?.value).toLowerCase(); const values = getUniqueValues(key); const counts = new Map(values.map(v => [v,0])); rows.forEach(r => { if(!rowMatchesSearch(r) || !rowMatchesSelections(r, key)) return; const v = getComparableValue(r, key); counts.set(v, (counts.get(v) || 0) + 1); }); container.innerHTML = values.filter(v => !searchText || v.toLowerCase().includes(searchText)).map(v => { const count = counts.get(v) || 0; const checked = selections.get(key).has(v); const disabled = count === 0 && !checked; const safeId = makeSafeId(key, v); return `<div class="option ${disabled ? 'disabled' : ''}"><input ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''} type="checkbox" id="${safeId}" data-key="${key}" data-val="${escapeHtml(v)}"><label for="${safeId}"><span>${escapeHtml(v)}</span><span class="optionCount">${count}</span></label></div>`; }).join('') || `<div class="option disabled"><label><span>${escapeHtml(t().noMatchOption)}</span><span class="optionCount">0</span></label></div>`; container.querySelectorAll('input[type="checkbox"]').forEach(box => { box.addEventListener('change', e => { const k = e.target.dataset.key, v = e.target.dataset.val; if(e.target.checked) selections.get(k).add(v); else selections.get(k).delete(v); page = 1; renderAll(); }); }); } renderSelected(); }
function getPageRows(){ const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize)); if(page > totalPages) page = totalPages; if(page < 1) page = 1; const start = (page - 1) * pageSize; return filtered.slice(start, start + pageSize); }
function renderCards(){ const pageRows = getPageRows(); if(!filtered.length){ el.cards.innerHTML = `<div class="empty">${escapeHtml(t().noMatch)}</div>`; return; } el.cards.innerHTML = pageRows.map(r => { const metaVals = [maybeTranslate(r.jurisdiction), maybeTranslate(r.country_or_region), maybeTranslate(r.subnational_area), maybeTranslate(r.language), r.year ? String(r.year) : '', displayTargeting(r.targeting_category)].filter(v => norm(v)); const meta = metaVals.map(v => `<span class="pill">${escapeHtml(v)}</span>`).join(''); return `<article class="card"><div class="title">${escapeHtml(r.document_title || t().card.noTitle)}</div><div class="meta">${meta}</div><div class="grid"><div class="field"><b>${escapeHtml(t().card.source)}</b>${escapeHtml(r.source || '—')}</div><div class="field"><b>${escapeHtml(t().card.document_type)}</b>${escapeHtml(maybeTranslate(r.document_type) || '—')}</div><div class="field"><b>${escapeHtml(t().card.hierarchy_level)}</b>${escapeHtml(maybeTranslate(r.hierarchy_level) || '—')}</div><div class="field"><b>${escapeHtml(t().card.targeting_category)}</b>${escapeHtml(displayTargeting(r.targeting_category) || '—')}</div><div class="field"><b>${escapeHtml(t().card.function_type)}</b>${escapeHtml(maybeTranslate(r.function_type) || '—')}</div><div class="field"><b>${escapeHtml(t().card.taxon_label_used_in_text)}</b>${escapeHtml(maybeTranslate(r.taxon_label_used_in_text) || '—')}</div><div class="field"><b>${escapeHtml(t().card.source_url)}</b>${r.source_url ? `<a href="${escapeHtml(r.source_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(t().card.open)}</a>` : '—'}</div></div>${norm(r.notes) ? `<div class="desc"><b style="color:var(--muted);font-weight:600">${escapeHtml(t().card.notes)}</b>${escapeHtml(r.notes)}</div>` : ''}</article>`; }).join(''); }
function renderTable(){ const pageRows = getPageRows(); if(!filtered.length){ el.tableBody.innerHTML = `<tr><td colspan="7">${escapeHtml(t().noMatch)}</td></tr>`; return; } el.tableBody.innerHTML = pageRows.map(r => `<tr><td>${escapeHtml(r.document_title || t().card.noTitle)}</td><td>${escapeHtml([maybeTranslate(r.country_or_region), maybeTranslate(r.subnational_area)].filter(Boolean).join(' / '))}</td><td>${escapeHtml(r.year || '')}</td><td>${escapeHtml(maybeTranslate(r.document_type) || '—')}</td><td>${escapeHtml(maybeTranslate(r.hierarchy_level) || '—')}</td><td>${escapeHtml(displayTargeting(r.targeting_category) || '—')}</td><td>${r.source_url ? `<a href="${escapeHtml(r.source_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(t().card.open)}</a>` : '—'}</td></tr>`).join(''); }
function renderPagination(){ const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize)); el.pageInfo.textContent = t().page(page, totalPages); el.prevBtn.disabled = page <= 1; el.nextBtn.disabled = page >= totalPages; }
function renderMainView(){ el.stats.textContent = t().stats(filtered.length, rows.length); if(viewMode === 'card'){ el.cards.classList.remove('hidden'); el.tableWrap.classList.add('hidden'); renderCards(); }else{ el.cards.classList.add('hidden'); el.tableWrap.classList.remove('hidden'); renderTable(); } renderPagination(); }
function exportCsv(){ const cols = ['jurisdiction','country_or_region','subnational_area','language','year','document_title','document_type','hierarchy_level','targeting_category','function_type','taxon_label_used_in_text','source','source_url','notes']; const esc = v => { const s = norm(v); if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"'; return s; }; const csv = [cols.join(',')].concat(filtered.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); const blob = new Blob(["\ufeff" + csv], {type:'text/csv;charset=utf-8;'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (sourceName || 'source') + '.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href); }
function applyStaticTexts(){ document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en'; applyLoadingTexts(); document.title = `${t().pageTitle}｜${sourceName || ''}`; el.titleMain.textContent = t().pageTitle; el.subMain.textContent = sourceName ? t().sub(sourceName) : t().noSourceParam; el.loadNote.textContent = allRows.length && loadedPath ? t().loaded(allRows.length, loadedPath) : ''; el.q.placeholder = t().searchPlaceholder; el.clearBtn.textContent = t().clear; el.langBtn.textContent = t().langBtn; el.backBtn.textContent = t().back; el.viewBtn.textContent = viewMode === 'card' ? t().viewTable : t().viewCard; el.exportBtn.textContent = t().export; el.prevBtn.textContent = t().prev; el.nextBtn.textContent = t().next; el.thTitle.textContent = t().table.title; el.thRegion.textContent = t().table.region; el.thYear.textContent = t().table.year; el.thDocType.textContent = t().table.document_type; el.thLevel.textContent = t().table.level; el.thTargeting.textContent = t().table.targeting; el.thSource.textContent = t().table.source; populateSortSelect(); el.footerText.innerHTML = footerHtml(); const backUrl = new URL('./source.html', window.location.href); backUrl.searchParams.set('lang', lang); el.backLink.href = backUrl.toString(); }
function renderAll(){ applyStaticTexts(); applyFilters(); renderFilters(); renderMainView(); }
async function main(){ applyLoadingTexts(); setLoadingProgress(10, t().loadingPreparing, t().loadingPreparingEn); buildFilterShell(); setLoadingProgress(45, t().loadingFetchingData, t().loadingFetchingDataEn); allRows = await loadRows(); if(!sourceName){ applyStaticTexts(); el.cards.innerHTML = `<div class="empty">${escapeHtml(t().noSourceParam)}</div>`; hideLoadingOverlay(); return; } rows = allRows.filter(r => norm(r.source) === sourceName); applyStaticTexts(); setLoadingProgress(80, t().loadingRendering, t().loadingRenderingEn); localStorage.setItem('wd_lang', lang); el.q.addEventListener('input', () => { page = 1; renderAll(); }); el.clearBtn.addEventListener('click', () => { el.q.value = ''; for(const key of FILTERS) selections.get(key).clear(); el.filters.querySelectorAll('.groupSearch').forEach(i => i.value = ''); page = 1; renderAll(); }); el.langBtn.addEventListener('click', () => { lang = lang === 'zh' ? 'en' : 'zh'; localStorage.setItem('wd_lang', lang); renderAll(); }); el.viewBtn.addEventListener('click', () => { viewMode = viewMode === 'card' ? 'table' : 'card'; localStorage.setItem('wd_view', viewMode); renderAll(); }); el.sortSelect.addEventListener('change', () => { sortMode = el.sortSelect.value; localStorage.setItem('wd_sort', sortMode); page = 1; renderAll(); }); el.exportBtn.addEventListener('click', exportCsv); el.prevBtn.addEventListener('click', () => { if(page > 1){ page--; renderMainView(); } }); el.nextBtn.addEventListener('click', () => { const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize)); if(page < totalPages){ page++; renderMainView(); } }); renderAll(); hideLoadingOverlay(); loadLatestGitHubCommitTime(); }
main().catch(err => { applyLoadingTexts(); if(el.loadingSub) el.loadingSub.textContent = String(err.message || err); applyStaticTexts(); el.cards.innerHTML = `<div class="empty">${escapeHtml(err.message || String(err))}</div>`; });
</script>
