<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>白海豚保护政策文本数据库</title>
<style>
:root{
  --bg:#f4fbff; --card:#ffffff; --line:#d7e5ef; --muted:#5b7285; --text:#10212f;
  --blue:#0ea5e9; --chip:#eef8ff;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--text);
  font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(14,165,233,.18), transparent 55%),
    radial-gradient(1000px 600px at 100% 0%, rgba(2,132,199,.10), transparent 50%),
    var(--bg);
  overflow-x:hidden;
  overflow-y:auto;
}
.wrap{max-width:1450px; margin:0 auto; padding:20px 16px 28px; min-height:100vh;}
.head,.sidebar,.main,.pageFooter{
  background:rgba(255,255,255,.88); border:1px solid var(--line); border-radius:18px;
  backdrop-filter: blur(8px); box-shadow:0 10px 28px rgba(15,23,42,.05);
}
.head{padding:18px 18px 14px; margin-bottom:14px;}
.headTop{display:flex; justify-content:space-between; gap:12px; align-items:flex-start;}
h1{margin:0 0 6px; font-size:28px}
.sub{margin:0; color:var(--muted)}
.note{margin:8px 0 0; color:var(--muted); font-size:12px}
.layout{display:grid; grid-template-columns:320px 1fr; gap:14px; align-items:start; min-height:calc(100vh - 160px);}
@media (max-width: 960px){ .layout{grid-template-columns:1fr; min-height:auto;} .headTop{flex-direction:column;} body{overflow:auto;} .sidebar,.main{max-height:none; overflow:visible;} .pageFooter{margin-top:14px;}}

.sidebar,.main{min-height:0;}

.pageFooter{
  padding:12px 14px; margin-top:14px; color:var(--muted); font-size:12px;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
}
.sidebar{padding:14px; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; overscroll-behavior:contain; scrollbar-gutter:stable;}
.main{padding:14px; max-height:calc(100vh - 24px); overflow-x:visible; overflow-y:auto; overscroll-behavior:contain; scrollbar-gutter:stable;}

.controls{display:grid; gap:12px;}
.search{display:flex; gap:8px; flex-wrap:wrap;}
input[type=text], button, select{
  border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--text);
  padding:10px 12px; font:inherit;
}
input[type=text]{flex:1; min-width:180px;}
button{cursor:pointer}
button:hover, select:hover{border-color:#b9d6e6; background:#fcfeff}
.langBtn{white-space:nowrap; font-weight:700;}

.rangeBox{border:1px solid var(--line); border-radius:14px; padding:12px; background:#fbfeff;}
.rangeLabel{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; color:var(--muted); font-size:12px;}
.rangeWrap{position:relative; height:34px; margin-top:2px;}
.track,.fill{position:absolute; left:0; right:0; top:50%; height:5px; transform:translateY(-50%); border-radius:999px;}
.track{background:#e4eef4}
.fill{background:linear-gradient(90deg, rgba(14,165,233,.25), rgba(14,165,233,.85));}
.rangeWrap input[type=range]{position:absolute; inset:0; width:100%; margin:0; appearance:none; background:none; pointer-events:none;}
.yearHist{position:relative; margin-top:10px; padding:8px 8px 6px; border-radius:12px; background:linear-gradient(180deg, rgba(248,252,255,.9), rgba(241,249,255,.72)); border:1px solid #e7f1f7;}
.yearBars{height:72px; display:grid; align-items:end; gap:0;}
.yearBar{position:relative; width:100%; min-height:2px; border-radius:0; background:linear-gradient(180deg, rgba(148,163,184,.42), rgba(148,163,184,.82)); transition:height .18s ease, opacity .18s ease, transform .18s ease, background .18s ease, box-shadow .18s ease;}
.yearBar:first-child{border-top-left-radius:4px;}
.yearBar:last-child{border-top-right-radius:4px;}
.yearBar.active{background:linear-gradient(180deg, rgba(125,211,252,.88), rgba(14,165,233,.98)); box-shadow:0 2px 8px rgba(14,165,233,.14);}
.yearBar.zero{min-height:1px; opacity:.35;}
.yearBar:hover{transform:translateY(-1px);}
.yearAxis{display:flex; justify-content:space-between; align-items:center; margin-top:6px; color:var(--muted); font-size:11px;}
.yearAxis span:last-child{text-align:right;}
.yearTooltip{position:absolute; left:0; top:0; z-index:8; min-width:98px; padding:8px 10px; border-radius:12px; background:rgba(16,33,47,.95); color:#fff; box-shadow:0 12px 28px rgba(15,23,42,.22); font-size:12px; line-height:1.25; pointer-events:none; opacity:0; transform:translate(-50%, -8px); transition:opacity .12s ease, transform .12s ease;}
.yearTooltip.show{opacity:1; transform:translate(-50%, -12px);}
.yearTooltipYear{font-weight:800; letter-spacing:.2px;}
.yearTooltipCount{margin-top:3px; color:rgba(255,255,255,.84);}
.rangeWrap input::-webkit-slider-thumb{
  appearance:none; width:16px; height:16px; border-radius:50%; background:var(--blue);
  border:2px solid #fff; box-shadow:0 0 0 1px rgba(14,165,233,.35); pointer-events:auto;
}
.rangeWrap input::-moz-range-thumb{width:16px; height:16px; border:none; border-radius:50%; background:var(--blue); pointer-events:auto;}

.filterGroup{border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-top:10px; background:#fbfeff;}
.filterHead{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  width:100%; border:none; background:#f8fcff; padding:10px 12px; cursor:pointer; font:inherit; font-weight:700;
}
.filterHead small{color:var(--muted); font-weight:400}
.filterBody{padding:10px 12px; border-top:1px solid #edf4f8;}
.groupSearch{width:100%; margin-bottom:8px; padding:8px 10px; border-radius:10px;}
.options{display:grid; gap:6px; max-height:220px; overflow:auto; padding-right:4px;}
.option{display:flex; align-items:flex-start; gap:8px; padding:2px 0; font-size:13px;}
.option input{margin-top:2px}
.option label{display:flex; justify-content:space-between; gap:8px; width:100%; cursor:pointer;}
.optionCount{color:var(--muted); white-space:nowrap}
.option.disabled{opacity:.45}
.selectedBox{margin-top:10px; font-size:12px; color:var(--muted);}
.selectedChip{display:inline-block; margin:4px 6px 0 0; padding:4px 8px; border-radius:999px; background:var(--chip); color:#065f8f; border:1px solid #ccecff;}

.toolbar{position:relative; z-index:50; display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:12px;}
.toolbarLeft,.toolbarRight{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.toolbarRight{position:relative; z-index:60;}
.vizMenu{position:relative; display:inline-flex; z-index:70;}
.vizTrigger{position:relative; z-index:72;}
.vizDropdown{
  position:absolute; top:calc(100% + 8px); right:0; min-width:132px;
  display:flex; flex-direction:column; gap:6px; padding:8px;
  border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.98);
  box-shadow:0 12px 28px rgba(15,23,42,.10);
  z-index:71;
  opacity:0; visibility:hidden; transform:translateY(-4px); pointer-events:none;
  transition:opacity .18s ease, transform .18s ease, visibility .18s ease;
}
.vizMenu.open .vizDropdown{
  opacity:1; visibility:visible; transform:translateY(0); pointer-events:auto;
}
.vizDropdown button{width:100%; text-align:left; white-space:nowrap;}
.stats{color:var(--muted); font-size:13px;}
.pill{display:inline-block; padding:4px 8px; border-radius:999px; background:var(--chip); border:1px solid #d6efff; color:#065f8f; font-size:12px; margin-right:6px}
.cards{display:grid; gap:10px;}
.card{border:1px solid var(--line); border-radius:16px; background:var(--card); padding:14px; box-shadow:0 6px 18px rgba(15,23,42,.04);}
.title{font-size:16px; font-weight:800; margin:0 0 8px;}
.meta{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
.meta .pill{margin-right:0}
.desc{color:#31475a; margin:8px 0 0; font-size:13px}
.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 14px; margin-top:10px;}
@media (max-width: 900px){ .grid{grid-template-columns:1fr;} }
.field{font-size:13px;}
.field b{display:inline-block; min-width:120px; color:var(--muted); font-weight:600}
a{color:#0284c7; text-decoration:none}
a:hover{text-decoration:underline}
.empty{border:1px dashed var(--line); border-radius:16px; padding:28px 16px; text-align:center; color:var(--muted); background:#fbfeff;}
.footer{margin-top:14px; color:var(--muted); font-size:12px;
  text-align:center;
  justify-content:center;
  align-items:center;
}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

.tableWrap{overflow:auto; border:1px solid var(--line); border-radius:16px; background:#fff;}
table{width:100%; border-collapse:collapse; min-width:980px;}
th,td{padding:10px 12px; border-bottom:1px solid #eef3f7; text-align:left; vertical-align:top; font-size:13px;}
th{background:#f8fcff; position:sticky; top:0; z-index:1;}
tbody tr:hover{background:#fbfeff;}

.resultsStage{opacity:1; transition:opacity .5s ease; will-change:opacity;}
.resultsStage.is-switching{opacity:0;}

.pagination{display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; margin-top:12px;}
.pageInfo{color:var(--muted); font-size:12px;}
.hidden{display:none;}

.loadingOverlay{
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(14,165,233,.18), transparent 55%),
    radial-gradient(1000px 600px at 100% 0%, rgba(2,132,199,.10), transparent 50%),
    rgba(244,251,255,.96);
  backdrop-filter: blur(10px);
  opacity:1; visibility:visible;
  transition:opacity .5s ease, visibility .5s ease;
}
.loadingOverlay.hidden{
  opacity:0; visibility:hidden; pointer-events:none;
}
.loadingPanel{
  width:min(520px, 92vw);
  background:rgba(255,255,255,.92);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 18px 48px rgba(15,23,42,.10);
  padding:26px 24px 22px;
}
.loadingTitle{
  margin:0 0 8px;
  font-size:22px;
  font-weight:800;
}
.loadingSub{
  margin:0 0 16px;
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
}
.loadingBar{
  position:relative;
  width:100%;
  height:12px;
  border-radius:999px;
  overflow:hidden;
  background:#e4eef4;
  border:1px solid #d7e5ef;
}
.loadingBarFill{
  width:0%;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg, rgba(125,211,252,.95), rgba(14,165,233,.98));
  transition:width .35s ease;
}
.loadingMeta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
}
.loadingPercent{
  color:var(--text);
  font-weight:800;
  font-variant-numeric: tabular-nums;
}

</style>
</head>
<body>

<div class="loadingOverlay" id="loadingOverlay" aria-live="polite">
  <div class="loadingPanel">
    <h2 class="loadingTitle" id="loadingTitle">正在加载 / Loading</h2>

    <div class="loadingBar" aria-hidden="true">
      <div class="loadingBarFill" id="loadingBarFill"></div>
    </div>
    <div class="loadingMeta">
      <span id="loadingStatus">准备中 / Preparing…</span>
      <span class="loadingPercent" id="loadingPercent">0%</span>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="head">
    <div class="headTop">
      <div>
        <h1 id="titleMain"></h1>
        <p class="sub" id="subMain"></p>
        <p class="note" id="loadNote"></p>
        <p class="note" style="margin-top:10px;">
          <a id="sourceEntryLink" href="./source.html" target="_blank" rel="noopener noreferrer"></a>
        </p>
      </div>
      <button id="langBtn" class="langBtn" type="button"></button>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="controls">
        <div class="search">
          <input id="q" type="text" />
          <button id="clearBtn" type="button"></button>
        </div>

        <div class="rangeBox">
          <div class="rangeLabel">
            <span id="yearLabel"></span>
            <span id="yearText">—</span>
          </div>
          <div class="rangeWrap">
            <div class="track"></div>
            <div class="fill" id="rangeFill"></div>
            <input id="yearMin" type="range" min="1900" max="2030" step="1" value="1900">
            <input id="yearMax" type="range" min="1900" max="2030" step="1" value="2030">
          </div>
          <div class="yearHist" id="yearHist">
            <div class="yearBars" id="yearBars"></div>
            <div class="yearTooltip" id="yearTooltip" aria-hidden="true"></div>
            <div class="yearAxis">
              <span id="yearAxisMin">—</span>

        <div id="filters"></div>
        <div class="selectedBox" id="selectedBox"></div>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="toolbarLeft">
          <div class="stats" id="stats">—</div>
        </div>
        <div class="toolbarRight">
          <select id="sortSelect"></select>
          <button id="viewBtn" type="button"></button>
          <div class="vizMenu" id="vizMenu">
            <button id="sankeyBtn" class="vizTrigger" type="button" aria-haspopup="true" aria-expanded="false"></button>
            <div class="vizDropdown" id="vizDropdown">
              <button id="mapBtn" type="button"></button>
              <button id="sankeyOptionBtn" type="button"></button>
            </div>
          </div>
          <button id="exportBtn" type="button"></button>
        </div>
      </div>

      <div id="resultsStage" class="resultsStage">
        <div id="cards" class="cards"></div>

        <div id="tableWrap" class="tableWrap hidden">
        <table>
          <thead>
            <tr>
              <th id="thTitle"></th>
              <th id="thRegion"></th>
              <th id="thYear"></th>
              <th id="thDocType"></th>
              <th id="thLevel"></th>
              <th id="thTargeting"></th>
              <th id="thSource"></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

        <div class="pagination">
          <button id="prevBtn" type="button"></button>
          <span class="pageInfo" id="pageInfo"></span>
          <button id="nextBtn" type="button"></button>
        </div>
      </div>

    </main>
  </div>

  <div class="pageFooter" id="footerText"></div>
</div>

function formatGitHubTimestamp(dateString, locale){
  if(!dateString) return "—";
  const d = new Date(dateString);
  if(Number.isNaN(d.getTime())) return "—";
  const zone = locale === 'zh' ? 'Asia/Shanghai' : 'UTC';
  const label = locale === 'zh' ? 'UTC+08:00' : 'UTC';
  const formatter = new Intl.DateTimeFormat(locale === 'zh' ? 'zh-CN' : 'en-GB', {
    timeZone: zone,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false
  });
  return `${formatter.format(d)} (${label})`;
}

function footerHtml(){
  if(!latestCommitInfo) return escapeHtml(t().footerLoading);

  const cn = formatGitHubTimestamp(latestCommitInfo.date, 'zh');
  const en = formatGitHubTimestamp(latestCommitInfo.date, 'en');
  return escapeHtml(t().footerTemplate(cn, en));
}

async function loadLatestGitHubCommitTime(){
  const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/commits/${GITHUB_BRANCH}`;
  try{
    const res = await fetch(url, {
      headers: {
        'Accept': 'application/vnd.github+json'
      },
      cache: 'no-store'
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    latestCommitInfo = {
      date: data?.commit?.committer?.date || data?.commit?.author?.date || null,
      sha: data?.sha || ''
    };
  }catch(err){
    latestCommitInfo = { error: true, message: String(err?.message || err) };
  }
  updateFooter();
}

async function loadDataWithProgress(){
  const totalCandidates = Math.max(1, DATA_CANDIDATES.length);
  const startBase = 10;
  const endBase = 88;
  const candidateSpan = (endBase - startBase) / totalCandidates;

  for(let i = 0; i < DATA_CANDIDATES.length; i++){
    const path = DATA_CANDIDATES[i];
    const baseStart = startBase + candidateSpan * i;
    const baseEnd = baseStart + candidateSpan;

    try{
      updateLoading(baseStart, 'loadingFetchingData');
      const res = await fetch(path, { cache:'no-store' });
      if(!res.ok) continue;

      const totalBytes = Number(res.headers.get('content-length') || 0);

      if(res.body && totalBytes > 0){
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let received = 0;
        let text = '';
        while(true){
          const { done, value } = await reader.read();
          if(done) break;
          if(value){
            received += value.byteLength;
            text += decoder.decode(value, { stream: true });
            const ratio = Math.max(0, Math.min(1, received / totalBytes));
            updateLoading(baseStart + candidateSpan * ratio, 'loadingFetchingData');
          }
        }
        text += decoder.decode();
        updateLoading(baseEnd - 0.20, 'loadingParsingData');
        const data = JSON.parse(text);
        if(Array.isArray(data) && data.length){
          loadedPath = path;
          updateLoading(baseEnd, 'loadingParsingData');
          return data;
        }
      }else{
        // Fallback when actual byte length is unavailable.
        const text = await res.text();
        updateLoading(baseStart + candidateSpan * 0.85, 'loadingParsingData');
        const data = JSON.parse(text);
        if(Array.isArray(data) && data.length){
          loadedPath = path;
          updateLoading(baseEnd, 'loadingParsingData');
          return data;
        }
      }
    }catch(e){}
  }
  throw new Error("No available data file");
}

function getComparableValue(r, key){
  let v = norm(r[key]) || "（空）";
  if(key === "targeting_category") return displayTargeting(v);

}
function getUniqueValues(key){
  const set = new Set();
  rows.forEach(r => set.add(getComparableValue(r, key)));
  return Array.from(set).sort((a,b)=>String(a).localeCompare(String(b), lang === "zh" ? 'zh-CN' : 'en'));

function rowMatchesSearch(r){
  const q = norm(el.q.value).toLowerCase();
  if(!q) return true;
  const pool = [
    r.document_title, r.country_or_region, r.subnational_area, r.document_type,
    r.hierarchy_level, r.targeting_category, displayTargeting(r.targeting_category),
    r.function_type, r.taxon_label_used_in_text, r.notes, r.source_url, r.language, r.jurisdiction,
    maybeTranslate(r.country_or_region), maybeTranslate(r.subnational_area), maybeTranslate(r.document_type),
    maybeTranslate(r.hierarchy_level), maybeTranslate(r.language)
  ].map(v => norm(v).toLowerCase()).join(" | ");
  return pool.includes(q);
}
function rowMatchesYear(r){
  const y = parseYear(r.year);
  if(y === null) return true;
  return y >= minYear && y <= maxYear;
}
function rowMatchesSelections(r, ignoreKey=null){
  for(const key of FILTERS){
    if(key === ignoreKey) continue;
    const sel = selections.get(key);
    if(!sel || sel.size === 0) continue;
    const val = getComparableValue(r, key);
    if(!sel.has(val)) return false;
  }
  return true;
}
function sortRows(arr){
  arr.sort((a,b) => {
    if(sortMode === "year_desc"){
      return (parseYear(b.year) ?? -Infinity) - (parseYear(a.year) ?? -Infinity);
    }
    if(sortMode === "year_asc"){
      return (parseYear(a.year) ?? Infinity) - (parseYear(b.year) ?? Infinity);
    }
    if(sortMode === "title_asc"){
      return norm(a.document_title).localeCompare(norm(b.document_title), lang === "zh" ? 'zh-CN' : 'en');
    }
    if(sortMode === "title_desc"){
      return norm(b.document_title).localeCompare(norm(a.document_title), lang === "zh" ? 'zh-CN' : 'en');
    }
    if(sortMode === "region_asc"){
      const ra = (maybeTranslate(a.country_or_region) + " " + maybeTranslate(a.subnational_area)).trim();
      const rb = (maybeTranslate(b.country_or_region) + " " + maybeTranslate(b.subnational_area)).trim();
      return ra.localeCompare(rb, lang === "zh" ? 'zh-CN' : 'en');
    }
    return 0;
  });
}

function makeSafeId(key, value){
  const raw = encodeURIComponent(value);
  return `${key}-${raw.replace(/[^a-zA-Z0-9_-]/g, "_")}`;
}
function renderFilters(){
  const sidebarScrollTop = el.sidebar ? el.sidebar.scrollTop : 0;
  relabelFilterHeads();
  for(const key of FILTERS){
    const container = document.getElementById(`opts-${key}`);
    const searchText = norm(el.filters.querySelector(`[data-group-search="${key}"]`)?.value).toLowerCase();
    const values = getUniqueValues(key);
    const counts = new Map(values.map(v => [v,0]));
    rows.forEach(r => {
      if(!rowMatchesSearch(r) || !rowMatchesYear(r) || !rowMatchesSelections(r, key)) return;
      const v = getComparableValue(r, key);
      counts.set(v, (counts.get(v) || 0) + 1);
    });
    container.innerHTML = values.filter(v => !searchText || v.toLowerCase().includes(searchText)).map(v => {
      const count = counts.get(v) || 0;
      const checked = selections.get(key).has(v);
      const disabled = count === 0 && !checked;
      const safeId = makeSafeId(key, v);
      return `
        <div class="option ${disabled ? 'disabled' : ''}">
          <input ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''} type="checkbox" id="${safeId}" data-key="${key}" data-val="${escapeHtml(v)}">
          <label for="${safeId}">
            <span>${escapeHtml(v)}</span>

function getYearCounts(){
  const counts = new Map();
  const years = rows.map(r => parseYear(r.year)).filter(v => v !== null);
  if(!years.length) return [];
  const start = Math.min(...years);
  const end = Math.max(...years);
  for(let y = start; y <= end; y++) counts.set(y, 0);
  rows.forEach(r => {
    const y = parseYear(r.year);
    if(y === null) return;
    if(!rowMatchesSearch(r) || !rowMatchesSelections(r)) return;
    counts.set(y, (counts.get(y) || 0) + 1);
  });
  return Array.from(counts.entries()).map(([year, count]) => ({ year, count }));
}

    if(d.count === 0) classes.push('zero');
    const label = `${d.year}: ${d.count}`;
    return `<div class="${classes.join(' ')}" style="height:${height}px" data-year="${escapeHtml(String(d.year))}" data-count="${escapeHtml(String(d.count))}" aria-label="${escapeHtml(label)}"></div>`;
  }).join('');
  showYearTooltip(null);
}
function updateRangeUI(){
  if(minYear > maxYear){ const tmp=minYear; minYear=maxYear; maxYear=tmp; }
  el.yearMin.value = minYear; el.yearMax.value = maxYear;
  el.yearText.textContent = `${minYear} — ${maxYear}`;
  const min = Number(el.yearMin.min), max = Number(el.yearMin.max);
  const left = ((minYear - min) / (max - min)) * 100;
  const right = ((maxYear - min) / (max - min)) * 100;
  el.rangeFill.style.left = `${left}%`;
  el.rangeFill.style.right = `${100 - right}%`;
}
function renderMainView(){
  el.stats.textContent = t().stats(filtered.length, rows.length);
  el.sankeyBtn.disabled = filtered.length === 0;
  if(el.mapBtn) el.mapBtn.disabled = filtered.length === 0;
  if(el.sankeyOptionBtn) el.sankeyOptionBtn.disabled = filtered.length === 0;
  if(viewMode === "card"){
    el.cards.classList.remove("hidden");
    el.tableWrap.classList.add("hidden");
    renderCards();
  }else{
    el.cards.classList.add("hidden");
    el.tableWrap.classList.remove("hidden");
    renderTable();
  }
  renderPagination();
}

let transitionTimer = null;
const MAIN_FADE_HALF_MS = 250;

function shouldAnimateMain(next = {}){
  return !!next.animateMain && !!el.resultsStage && !el.loadingOverlay?.classList.contains('hidden') === false;
}

function runMainFadeSwitch(nextRender){
  if(!el.resultsStage){
    nextRender();
    return;
  }
  if(transitionTimer){
    clearTimeout(transitionTimer);
    transitionTimer = null;
  }
  const stage = el.resultsStage;
  const lockHeight = stage.offsetHeight;
  if(lockHeight > 0) stage.style.minHeight = `${lockHeight}px`;
  stage.classList.add('is-switching');
  transitionTimer = setTimeout(() => {
    nextRender();
    requestAnimationFrame(() => {
      stage.classList.remove('is-switching');
      requestAnimationFrame(() => {
        stage.style.minHeight = '';
      });
    });
    transitionTimer = null;
  }, MAIN_FADE_HALF_MS);
}

function renderAll(options = {}){
  applyStaticTexts();
  updateRangeUI();
  applyFilters();
  renderYearHistogram();
  renderFilters();

  const renderMainOnly = () => {
    renderMainView();
  };

  if(options.animateMain){
    runMainFadeSwitch(renderMainOnly);
  }else{
    renderMainOnly();
  }
}
function buildVisualizationPayload(){
  return {
    lang,
    q: norm(el.q.value),
    minYear,
    maxYear,
    loadedPath,
    filters: Object.fromEntries(FILTERS.map(key => [key, Array.from(selections.get(key) || [])])),
    generatedAt: Date.now()
  };
}

function storeVisualizationState(payload){
  try{
    const encoded = JSON.stringify(payload);
    sessionStorage.setItem('wd_visual_state', encoded);
    localStorage.setItem('wd_visual_state', encoded);
    sessionStorage.setItem('wd_sankey_state', encoded);
    localStorage.setItem('wd_sankey_state', encoded);
    sessionStorage.setItem('wd_map_state', encoded);
    localStorage.setItem('wd_map_state', encoded);
    localStorage.setItem('wd_lang', lang);
  }catch(err){
    console.warn('Unable to store visualization state', err);
  }
}

function openVisualizationPage(target){
  const payload = buildVisualizationPayload();
  storeVisualizationState(payload);
  window.open(target, '_blank');
}

function openSankeyView(){
  openVisualizationPage('./sankey.html');
}

function openMapView(){
  openVisualizationPage('./map.html');
}

function exportCsv(){
  const cols = [
    "jurisdiction","country_or_region","subnational_area","language","year",
    "document_title","document_type","hierarchy_level","targeting_category",
    "function_type","taxon_label_used_in_text","source_url","notes"
  ];
  const esc = v => {
    const s = norm(v);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  };
  const csv = [cols.join(",")].concat(filtered.map(r => cols.map(c => esc(r[c])).join(","))).join("\n");
  const blob = new Blob(["\ufeff" + csv], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = lang === "zh" ? "当前筛选结果.csv" : "filtered_results.csv";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}
function initYears(){
  const years = rows.map(r => parseYear(r.year)).filter(v => v !== null);
  minYear = years.length ? Math.min(...years) : 1900;
  maxYear = years.length ? Math.max(...years) : 2030;
  el.yearMin.min = el.yearMax.min = String(minYear);
  el.yearMin.max = el.yearMax.max = String(maxYear);
  el.yearMin.value = String(minYear);
  el.yearMax.value = String(maxYear);
}

let loadingValue = 0;

function updateLoading(progress, statusKey){
  loadingValue = Math.max(0, Math.min(100, Number(progress) || 0));
  const pctText = `${loadingValue.toFixed(2)}%`;
  if(el.loadingPercent) el.loadingPercent.textContent = pctText;
  if(el.loadingBarFill) el.loadingBarFill.style.width = `${loadingValue}%`;
  if(el.loadingTitle) el.loadingTitle.textContent = `${t().loadingTitle} / ${t().loadingTitleEn}`;
  if(el.loadingSub) el.loadingSub.textContent = `${t().loadingSub} / ${t().loadingSubEn}`;
  if(el.loadingStatus && statusKey){
    const a = t()[statusKey] || '';
    const b = t()[`${statusKey}En`] || '';
    el.loadingStatus.textContent = b ? `${a} / ${b}` : a;
  }
}
function hideLoadingOverlay(){
  updateLoading(100, 'loadingDone');
  if(el.loadingOverlay){
    setTimeout(() => el.loadingOverlay.classList.add('hidden'), 120);
  }
}

async function main(){
  updateLoading(2.00, 'loadingPreparing');
  buildFilterShell();
  updateLoading(9.00, 'loadingPageReady');

  rows = await loadDataWithProgress();

  initYears();
  bindYearHistogramTooltip();
  loadLatestGitHubCommitTime();
  updateLoading(92.00, 'loadingRendering');

  el.q.addEventListener('input', () => { page = 1; renderAll({ animateMain: true }); });
  el.filters.addEventListener('click', (e) => {
    const interactive = e.target.closest('button, input, label, select, a');
    if(interactive) e.stopPropagation();
  });
  el.clearBtn.addEventListener('click', () => {
    el.q.value = "";
    for(const key of FILTERS) selections.get(key).clear();
    el.filters.querySelectorAll('.groupSearch').forEach(i => i.value = "");
    minYear = Number(el.yearMin.min);
    maxYear = Number(el.yearMax.max);
    page = 1;
    renderAll({ animateMain: true });
  });
  el.yearMin.addEventListener('input', () => { minYear = Math.min(Number(el.yearMin.value), Number(el.yearMax.value)); page = 1; renderAll({ animateMain: true }); });
  el.yearMax.addEventListener('input', () => { maxYear = Math.max(Number(el.yearMax.value), Number(el.yearMin.value)); page = 1; renderAll({ animateMain: true }); });
  const closeVizMenu = () => {
    if(el.vizMenu) el.vizMenu.classList.remove('open');
    if(el.sankeyBtn) el.sankeyBtn.setAttribute('aria-expanded', 'false');
  };
  const openVizMenu = () => {
    if(el.vizMenu) el.vizMenu.classList.add('open');
    if(el.sankeyBtn) el.sankeyBtn.setAttribute('aria-expanded', 'true');
  };
  const toggleVizMenu = () => {
    if(!el.vizMenu) return;
    const willOpen = !el.vizMenu.classList.contains('open');
    if(willOpen) openVizMenu();
    else closeVizMenu();
  };

  el.sankeyBtn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    toggleVizMenu();
  });
  if(el.mapBtn) el.mapBtn.addEventListener('click', (e) => { e.stopPropagation(); closeVizMenu(); openMapView(); });
  if(el.sankeyOptionBtn) el.sankeyOptionBtn.addEventListener('click', (e) => { e.stopPropagation(); closeVizMenu(); openSankeyView(); });
  if(el.sankeyBtn){
    el.sankeyBtn.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown'){
        e.preventDefault();
        openVizMenu();
        if(el.mapBtn) el.mapBtn.focus();
      } else if(e.key === 'Escape'){
        closeVizMenu();
        el.sankeyBtn.focus();
      }
    });
  }
  document.addEventListener('click', (e) => {
    if(el.vizMenu && !el.vizMenu.contains(e.target)) closeVizMenu();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeVizMenu();
  });
  el.exportBtn.addEventListener('click', exportCsv);
  el.langBtn.addEventListener('click', () => {
    lang = lang === "zh" ? "en" : "zh";
    localStorage.setItem("wd_lang", lang);
    page = 1;
    renderAll({ animateMain: true });
  });
  el.viewBtn.addEventListener('click', () => {
    viewMode = viewMode === "card" ? "table" : "card";
    localStorage.setItem("wd_view", viewMode);
    renderAll({ animateMain: true });
  });
  el.sortSelect.addEventListener('change', () => {
    sortMode = el.sortSelect.value;
    localStorage.setItem("wd_sort", sortMode);
    page = 1;
    renderAll({ animateMain: true });
  });
  el.prevBtn.addEventListener('click', () => { if(page > 1){ page--; renderMainView(); } });
  el.nextBtn.addEventListener('click', () => { const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize)); if(page < totalPages){ page++; renderMainView(); } });

  renderAll();
  updateLoading(99.20, 'loadingRendering');
  hideLoadingOverlay();
}
main().catch(err => {
  applyStaticTexts();
  updateLoading(100, 'loadingDone');
  if(el.loadingStatus) el.loadingStatus.textContent = t().loadFail + err.message;
  if(el.loadingSub) el.loadingSub.innerHTML = t().loadFailTip;
  el.loadNote.textContent = t().loadFail + err.message;
  el.cards.innerHTML = `<div class="empty">${t().loadFailTip}</div>`;
});
</script>
</body>
</html>
